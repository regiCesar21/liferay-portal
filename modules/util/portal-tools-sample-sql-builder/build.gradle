import java.util.jar.Attributes
import java.util.jar.JarFile

task writeReleases

classes {
	dependsOn writeReleases
}

dependencies {
	api group: "com.liferay", name: "com.liferay.blogs.api", version: "3.1.0"
	api group: "com.liferay", name: "com.liferay.dynamic.data.lists.api", version: "2.0.0"
	api group: "com.liferay", name: "com.liferay.dynamic.data.lists.service", version: "1.0.0"
	api group: "com.liferay", name: "com.liferay.dynamic.data.mapping.api", version: "3.0.0"
	api group: "com.liferay", name: "com.liferay.dynamic.data.mapping.service", version: "2.0.0"
	api group: "com.liferay", name: "com.liferay.dynamic.data.mapping.web", version: "1.0.0"
	api group: "com.liferay", name: "com.liferay.journal.api", version: "2.0.0"
	api group: "com.liferay", name: "com.liferay.journal.service", version: "3.0.0"
	api group: "com.liferay", name: "com.liferay.message.boards.api", version: "3.0.0"
	api group: "com.liferay", name: "com.liferay.message.boards.web", version: "1.0.0"
	api group: "com.liferay.portal", name: "com.liferay.util.java", version: "2.0.0"
	api group: "javax.portlet", name: "portlet-api", version: "2.0"
	api project(":apps:collaboration:document-library:document-library-api")
	api project(":apps:collaboration:wiki:wiki-api")
	api project(":apps:collaboration:wiki:wiki-service")
	compileOnly group: "com.liferay", name: "com.liferay.petra.string", version: "1.0.0"
	compileOnly group: "com.liferay", name: "org.freemarker", version: "2.3.23.LIFERAY-PATCHED-4"
	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.impl", version: "default"
	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "default"
}

writeReleases {
	dependsOn configurations.compileClasspath

	doLast {
		File releasesTxtFile = new File(processResources.destinationDir, "com/liferay/portal/tools/sample/sql/builder/dependencies/releases.txt")

		releasesTxtFile.withWriter("UTF-8") {
			Writer writer ->

			configurations.compileClasspath.each {
				println "Adding release information from ${it} into ${releasesTxtFile}"

				JarFile jarFile = new JarFile(it)

				Attributes mainAttributes = jarFile.manifest.mainAttributes

				String schemaVersion = mainAttributes.getValue("Liferay-Require-SchemaVersion")

				if (!schemaVersion) {
					return
				}

				String symbolicName = mainAttributes.getValue("Bundle-SymbolicName")

				writer.writeLine "${symbolicName}:${schemaVersion}"
			}
		}
	}
}