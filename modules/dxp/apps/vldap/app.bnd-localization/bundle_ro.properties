liferay-releng-app-description=Lightweight Directory Access Protocol (LDAP) este un protocol de aplicație pentru accesarea și menținerea serviciilor distribuite de informații de director pe o rețea IP (Internet Protocol).<br /><br />Această aplicație expune stocul de date al utilizatorilor Liferay prin intermediul protocoalelor LDAP. Acest lucru permite instrumentelor terțe să acceseze informațiile despre utilizatorii Liferay (profil, roluri, grupuri etc.) ca și cum ar accesa un server LDAP.<br /><br />Această aplicație se instalează ca un serviciu Liferay.