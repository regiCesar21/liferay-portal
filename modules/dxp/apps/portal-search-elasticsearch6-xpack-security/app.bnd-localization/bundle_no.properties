liferay-releng-app-description=The ${liferay.releng.app.title.prefix} Enterprise Search Security app allows you to connect your Liferay DXP instance to an Elasticsearch cluster.<br />From Elastic's website, "With Security, you can password-protect your data as well as implement more advanced security measures such as encrypting communications, role-based access control, IP filtering, and auditing."<br />More information about Elasticsearch security can be found at https://www.elastic.co/guide/en/elastic-stack-overview/6.8/elasticsearch-security.html.<br />To learn about compatibility, see the compatibility matrix: https://help.liferay.com/hc/en-us/articles/360016511651#Liferay-Enterprise-Search. (Automatic Copy)