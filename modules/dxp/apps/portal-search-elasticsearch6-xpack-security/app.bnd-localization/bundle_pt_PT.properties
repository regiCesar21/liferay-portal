liferay-releng-app-description=O aplicativo Enterprise Search Security ${liferay.releng.app.title.prefix} permite que você conecte sua instância DXP do Liferay a um cluster Elasticsearch.<br />Do site da Elastic, "De forma segura, você pode proteger seus dados com senha, bem como implementar medidas de segurança mais avançadas, como criptografia de comunicações, controle de acesso baseado em funções, filtragem de IP e auditoria."<br />Para obter mais informações informações sobre a segurança Elasticsearch, consulte https://www.elastic.co/guide/en/elastic-stack-overview/6.8/elasticsearch-security.html.<br />Para saber mais sobre compatibilidade, consulte a Matriz de compatibilidade: https://help.liferay.com/hc/en-us/articles/360016511651#Liferay-Enterprise-Search.