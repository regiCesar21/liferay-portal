liferay-releng-app-description=Met de ${liferay.releng.app.title.prefix} Enterprise Search Security-app kunt u uw Liferay DXP-instantie verbinden met een Elasticsearch-cluster.<br />Afkomstig van de Elastic-website: "Met beveiliging kunt u uw gegevens met een wachtwoord beveiligen en meer geavanceerde beveiligingsmaatregelen implementeren, zoals het versleutelen van communicatie, op rollen gebaseerde toegangscontrole, IP-filtering en auditing".<br />Meer informatie over Elasticsearch-beveiliging is te vinden op https://www.elastic.co/guide/en/elastic-stack-overview/6.8/elasticsearch-security.html.<br />Raadpleeg de compatibiliteitsmatrix voor meer informatie over compatibiliteit: https://help.liferay.com/hc/en-us/articles/360016511651#Liferay-Enterprise-Search.