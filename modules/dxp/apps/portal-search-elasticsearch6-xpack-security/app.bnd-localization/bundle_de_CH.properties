liferay-releng-app-description=Die ${liferay.releng.app.title.prefix} Enterprise Search Security-App ermöglicht es Ihnen, Ihre Liferay-DXP-Instanz mit einem Elasticsearch-Cluster zu verbinden.<br />Auf der Elastic-Website heißt es: "Mit Security können Sie Ihre Daten mit einem Kennwort schützen sowie erweiterte Sicherheitsmaßnahmen wie die Verschlüsselung der Kommunikation, rollenbasierte Zugriffskontrolle, IP-Filterung und Auditing implementieren."<br />Weitere Informationen zur Sicherheit mit Elasticsearch finden Sie unter https://www.elastic.co/guide/en/elastic-stack-overview/6.8/elasticsearch-security.html.<br />Weitere Informationen zur Kompatibilität finden Sie in der Kompatibilitätsmatrix: https://help.liferay.com/hc/en-us/articles/360016511651#Liferay-Enterprise-Search.