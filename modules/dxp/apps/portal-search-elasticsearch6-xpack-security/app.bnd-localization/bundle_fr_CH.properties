liferay-releng-app-description=L'application Enterprise Search Security de ${liferay.releng.app.title.prefix} vous permet de connecter votre instance Liferay DXP à un cluster Elasticsearch.<br />Sur le site Web d'Elastic, "Avec Security, vous pouvez protéger vos données par mot de passe comme et mettre en œuvre des mesures de sécurité plus avancées telles que le chiffrement des communications, le contrôle d'accès basé sur les rôles, le filtrage IP et l'audit."<br />Pour plus d'informations sur la sécurité d'Elasticsearch, consultez https://www.elastic.co/guide/en/elastic-stack-overview/6.8/elasticsearch-security.html.<br />Pour en savoir plus sur la compatibilité, consultez la matrice de compatibilité : https://help.liferay.com/hc/en-us/articles/360016511651#Liferay-Enterprise-Search.