liferay-releng-app-description=${liferay.releng.app.title.prefix} Aplicația Enterprise Search Cross-Cluster Replication vă permite să efectuați operații de citire dintr-un cluster local care a fost configurat să reproducă sau să urmărească indicii unui cluster la distanță. Clusterul local care conține indicii reproduse trebuie să fie configurat manual înainte ca această aplicație să poată executa cereri împotriva acestuia. Puteți găsi mai multe informații despre Cross-Cluster Replication la adresa https://www.elastic.co/guide/en/elasticsearch/reference/7.9/xpack-ccr.html.<br />Pentru a afla mai multe despre compatibilitate, consultați matricea de compatibilitate:https://help.liferay.com/hc/en-us/articles/360016511651#Liferay-Enterprise-Search.