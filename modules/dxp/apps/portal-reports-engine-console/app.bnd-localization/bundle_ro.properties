liferay-releng-app-description=Profitați de interfața intuitivă și ușor de utilizat a Liferay Reports pentru a crea și programa rulări de generare a rapoartelor. Aplicația Liferay Reports împachetează un motor de raportare cu Jasper Reports, o implementare excelentă, oferindu-vă posibilitatea imediată de a încărca definiții de rapoarte (concepute într-un designer de rapoarte) în Reports Admin și de a le rula din fila Definitions. Generați rapoarte manual sau programați execuții de generare a rapoartelor. Exportați rapoarte în format HTML, CSV, XLS, PDF și multe altele. Rapoartele pot fi vizualizate în aplicația Reports Admin din panoul de control sau pe o pagină cu ajutorul aplicației Reports Display și pot fi, de asemenea, livrate prin e-mail.