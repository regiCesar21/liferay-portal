component.names=\
    liferay-connected-services-fix-packs,\
    liferay-connected-services-known-issues,\
    liferay-connected-services-notifications,\
    liferay-connected-services-project-administration,\
    liferay-connected-services-subscriptions,\
    liferay-connected-services-user-management

jenkins.private.property.names=\
    lcs.email.address.1,\
    lcs.email.address.2,\
    lcs.email.address.3,\
    lcs.email.password.1,\
    lcs.email.password.2,\
    lcs.email.password.3,\
    marketplace.email.address.1,\
    marketplace.email.address.2,\
    marketplace.email.address.3,\
    marketplace.email.address.4,\
    marketplace.email.address.5,\
    marketplace.email.password.1,\
    marketplace.email.password.2,\
    marketplace.email.password.3,\
    marketplace.email.password.4,\
    marketplace.email.password.5,\
    osb.lcs.gateway.web.host.name,\
    osb.lcs.gateway.web.host.port,\
    osb.lcs.gateway.web.protocol,\
    osb.lcs.portlet.host.name,\
    osb.lcs.portlet.host.port,\
    osb.lcs.portlet.oauth.consumer.key,\
    osb.lcs.portlet.oauth.consumer.secret,\
    osb.lcs.portlet.protocol

portal.bundle.version=7.0.10

test.batch.run.property.query[plugins-functional-bundle-tomcat-mysql56-jdk7]=\
    lcs.acceptance == true

test.batch.run.type=single

test.build.fix.pack.zip.url=\
    https://files.liferay.com/private/ee/fix-packs/7.0.10/de/liferay-fix-pack-de-9-7010.zip

test.case.available.property.names=\
    ${test.case.required.property.names},\
    app.server.bundles.size,\
    cluster.enabled,\
    lcs.acceptance,\
    osgi.app.includes,\
    portlet.plugins.includes,\
    skip.start-app-server,\
    test.run.environment,\
    testray.main.component.name

test.case.required.property.names=testray.main.component.name
test.fix.pack.base.url=http://files.liferay.com/private/ee/fix-packs

test.include.dir.names=\
    ${project.dir}/portal-web/test/functional/com/liferay/portalweb

portlet.properties.lcs-portlet=\
    osb.lcs.gateway.web.host.name=${osb.lcs.gateway.web.host.name}${line.separator}osb.lcs.gateway.web.host.port=${osb.lcs.gateway.web.host.port}${line.separator}${line.separator}osb.lcs.gateway.web.protocol=${osb.lcs.gateway.web.protocol}${line.separator}osb.lcs.portlet.host.name=${osb.lcs.portlet.host.name}${line.separator}osb.lcs.portlet.host.port=${osb.lcs.portlet.host.port}${line.separator}${line.separator}osb.lcs.portlet.oauth.consumer.key=${osb.lcs.portlet.oauth.consumer.key}${line.separator}osb.lcs.portlet.oauth.consumer.secret=${osb.lcs.portlet.oauth.consumer.secret}${line.separator}osb.lcs.portlet.protocol=${osb.lcs.portlet.protocol}

test.batch.bundle.version[plugins-functional-bundle-tomcat-mysql56-jdk7]=7.0.10

test.batch.release.run.property.query[plugins-functional-bundle-tomcat-mysql56-jdk7]=\
    testray.main.component.name == "Liferay Connected Services"

test.deploy.license=false