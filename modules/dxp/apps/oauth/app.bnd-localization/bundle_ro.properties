liferay-releng-app-description=Aplicația Liferay Connector to OAuth Provider 1.0a autorizează aplicațiile terțe să interacționeze cu aplicațiile unui utilizator Liferay. OAuth este un "mecanism de strângere de mână" care redirecționează utilizatorii Liferay către un furnizor de servicii, unde aceștia îi pot spune furnizorului de servicii să permită accesul limitat al unui plugin la conturile lor Liferay. Astfel, pluginul nu stochează niciunul dintre datele de identificare ale utilizatorului, evitând riscurile de securitate. Aplicația Liferay Connector to OAuth Provider 1.0a oferă două portlets care permit înregistrarea unui plugin pentru OAuth și, respectiv, autorizarea utilizatorilor OAuth. Odată ce plugin-ul este înregistrat pentru OAuth și accesat, utilizatorul este redirecționat către furnizorul de servicii pentru a delega autentificarea utilizatorului.<br /><br />Această aplicație va apărea în panoul de control și în meniul Contul meu. Liferay Connector to OAuth Provider 1.0a 3.x utilizează standardul OAuth 1.0.