liferay-releng-app-description=${liferay.releng.app.title.prefix} Aplicația Enterprise Search Monitoring monitorizează clusterul Elasticsearch în timp real, oferind o vizualizare a interfeței de monitorizare Kibana prin intermediul unei instanțe Liferay DXP.<br />Conform site-ului Elastic, "Din interfața de monitorizare Kibana, puteți identifica problemele dintr-o privire și puteți cerceta comportamentul sistemului în timp pentru a diagnostica problemele operaționale".<br />Trebuie să instalați Kibana înainte de a utiliza aplicația ${liferay.releng.app.title.prefix} Plugin de monitorizare Enterprise Search. Puteți găsi mai multe informații despre monitorizarea Elasticsearch la https://www.elastic.co/guide/en/kibana/current/xpack-monitoring.html.<br />Pentru a afla mai multe despre compatibilitate, consultați matricea de compatibilitate: https://help.liferay.com/hc/en-us/articles/360016511651#Liferay-Enterprise-Search.