liferay-releng-app-description=Este aplicativo permite que o Liferay detecte qual dispositivo móvel ou sistema operacional está sendo usado para uma determinada solicitação e que altere o layout/renderização das páginas dependendo do dispositivo detectado. Depois de instalado, você pode definir novas regras para dispositivos móveis e aplicá-las a sites e páginas individuais. A proporção de usuários de dispositivos móveis que navegam na web tem aumentado constantemente, por isso é importante ser capaz de gerenciar adequadamente diferentes tipos de dispositivos. Por exemplo, você pode configurar a aparência das páginas do Liferay que os usuários de smartphones ou tablets acessam de forma diferente daquelas que os usuários de PC acessam. Sites e páginas individuais podem ser configurados com qualquer número de grupos de regras projetados para descrever um grupo de dispositivos. Ele pode conter uma ou mais regras que descrevem uma categoria de dispositivos, como todos os dispositivos Android ou todos os tablets iOS. Os grupos de regras podem ser priorizados para determinar qual deles será aplicado a uma determinada solicitação de página. Você pode definir quantas regras forem necessárias para categorizar todos os dispositivos nos quais deseja realizar ações. O banco de dados de dispositivos para este aplicativo inclui aproximadamente 600.000 combinações de dispositivos (combinações de dispositivos, software e navegador) e 200 propriedades.<br /><br />Este aplicativo é instalado como um serviço Liferay.