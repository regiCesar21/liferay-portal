liferay-releng-app-description=Mit dieser App kann Liferay erkennen, welches mobile Gerät oder Betriebssystem für eine bestimmte Anfrage verwendet wird, und ändert das Layout/die Darstellung von Seiten basierend auf dem erkannten Gerät. Nach der Installation können Sie neue Regeln für mobile Geräte definieren und diese auf Websites und einzelne Seiten anwenden. Der Anteil der Nutzer, die mit mobilen Geräten im Web surfen, nimmt stetig zu, daher ist es wichtig, mit den verschiedenen Gerätetypen angemessen umgehen zu können. So können Sie beispielsweise das Erscheinungsbild von Liferay-Seiten, die von Smartphone- oder Tablet-Benutzern aufgerufen werden, anders konfigurieren als die von PC-Benutzern aufgerufenen. Sowohl ganze Websites als auch einzelne Seiten können mit einer beliebigen Anzahl von Regelgruppen konfiguriert werden, die eine Gruppe von Geräten beschreiben. Sie kann eine oder mehrere Regeln enthalten, die eine Gerätekategorie beschreiben, wie z. B. alle Android-Geräte oder alle iOS-Tablets. Regelgruppen können priorisiert werden, um zu bestimmen, welche auf eine bestimmte Seitenanforderung angewandt werden soll. Sie können so viele Regeln definieren, wie Sie benötigen, um alle Geräte zu klassifizieren, auf denen Sie Aktionen durchführen möchten. Die Gerätedatenbank in dieser App umfasst etwa 600.000 Gerätekombinationen (Kombination aus Geräten, Software und Browsern) und 200 Eigenschaften.<br /><br />Diese App wird als Liferay-Dienst installiert.