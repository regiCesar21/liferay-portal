components:
    parameters:
        AgentName:
            in: query
            description:
                The name of the user doing the action. If it is an automated action, this can be left blank.
            name: agentName
            required: false
            schema:
                type: string
        AgentUID:
            in: query
            description:
                The UUID of the user doing the action. If it is an automated action, this can be left blank.
            name: agentUID
            required: false
            schema:
                type: string
    schemas:
        AppLicenseKey:
            description:
                Represents a DXP App license key.
            properties:
                active:
                    description:
                        If the license key is active or not.
                    type: boolean
                complimentary:
                    description:
                        If the license key counts towards the customer's purchase.
                    readOnly: true
                    type: boolean
                createDate:
                    description:
                        The create date of the license key.
                    format: date-time
                    readOnly: true
                    type: string
                description:
                    description:
                        The description of the license key.
                    type: string
                expirationDate:
                    description:
                        The date the license key expires.
                    format: date-time
                    type: string
                hostName:
                    description:
                        The host name of the license key.
                    type: string
                id:
                    description:
                        The id of the license key.
                    format: int64
                    type: integer
                ipAddresses:
                    description:
                        The IP addresses of the license key.
                    type: string
                key:
                    description:
                        The hash key of the license key.
                    readOnly: true
                    type: string
                licenseType:
                    description:
                        The name of the license entry of the license key.
                    enum: ["developer", "enterprise", "oem", "production", "virtual-cluster"]
                    type: string
                macAddresses:
                    description:
                        The MAC addresses of the license key.
                    type: string
                modifiedDate:
                    description:
                        The last date the license key was modified.
                    format: date-time
                    readOnly: true
                    type: string
                modifiedUserName:
                    description:
                        The name of the user who last modified the license key.
                    readOnly: true
                    type: string
                modifiedUserUuid:
                    description:
                        The uuid of the user who last modified the license key.
                    readOnly: true
                    type: string
                orderId:
                    description:
                        The order Id license key belongs to.
                    type: string
                owner:
                    description:
                        The owner of the license key.
                    type: string
                productId:
                    description:
                        The id of the product of the license key.
                    type: string
                productName:
                    description:
                        The name of the product of the license key.
                    type: string
                productVersion:
                    description:
                        The version of the product of the license key.
                    type: string
                startDate:
                    description:
                        The date the license key can start being used.
                    format: date-time
                    type: string
                userName:
                    description:
                        The name of the user who created the license key.
                    readOnly: true
                    type: string
                userUuid:
                    description:
                        The uuid of the user who created the license key.
                    readOnly: true
                    type: string
            type: object
        LicenseKey:
            description:
                Represents a license key.
            properties:
                accountKey:
                    description:
                        The key of the license key's account.
                    type: string
                accountName:
                    description:
                        The name of the license key's account.
                    readOnly: true
                    type: string
                active:
                    description:
                        If the license key is active or not.
                    type: boolean
                additionalInfo:
                    description:
                        Any additional information for the license key.
                    type: string
                assetReceiptLicenseUuid:
                    description:
                        The uuid of the asset receipt of the license key.
                    type: string
                clusterId:
                    description:
                        The id of the cluster of the license key if applicable.
                    format: int64
                    type: integer
                complimentary:
                    description:
                        If the license key counts towards the customer's purchase.
                    type: boolean
                createDate:
                    description:
                        The create date of the license key.
                    format: date-time
                    readOnly: true
                    type: string
                description:
                    description:
                        The description of the license key.
                    type: string
                expirationDate:
                    description:
                        The date the license key expires.
                    format: date-time
                    type: string
                hostName:
                    description:
                        The host name of the license key.
                    type: string
                id:
                    description:
                        The id of the license key.
                    format: int64
                    type: integer
                ipAddresses:
                    description:
                        The IP addresses of the license key.
                    type: string
                key:
                    description:
                        The hash key of the license key.
                    readOnly: true
                    type: string
                licenseEntryName:
                    description:
                        The name of the license entry of the license key.
                    enum: ["Commerce Subscription Backup", "Commerce Subscription Backup (Virtual Cluster)", "Commerce Subscription Development", "Commerce Subscription Non-Production", "Commerce Subscription Non-Production (Virtual Cluster)", "Commerce Subscription Production", "Commerce Subscription Production (Virtual Cluster)", "Commerce Subscription Unlimited Enterprise-Wide", "DXP Backup", "DXP Backup (Virtual Cluster)", "DXP Development", "DXP Development (Cluster)", "DXP Flex", "DXP Limited", "DXP Non-Production", "DXP Non-Production (Virtual Cluster)", "DXP OEM", "DXP Production", "DXP Production (Virtual Cluster)", "DXP Unlimited Enterprise-Wide", "Portal Backup", "Portal Backup (Additional JVM)", "Portal Backup (Cluster)", "Portal Developer", "Portal Developer (Cluster)", "Portal Enterprise", "Portal Limited", "Portal Non-Production", "Portal Non-Production (Additional JVM)", "Portal Non-Production (Cluster)", "Portal Non-Production (Elastic)", "Portal Non-Production (Monthly)", "Portal OEM", "Portal Per User", "Portal Production", "Portal Production (Additional JVM)", "Portal Production (Cluster)"]
                    type: string
                licenseEntryType:
                    description:
                        The type of the license entry of the license key.
                    enum: ["cluster", "developer", "developer-cluster", "enterprise", "limited", "oem", "per-user", "production", "virtual-cluster"]
                    type: string
                licenseVersion:
                    description:
                        The portal's license version of the license key.
                    type: integer
                macAddresses:
                    description:
                        The MAC addresses of the license key.
                    type: string
                maxClusterNodes:
                    description:
                        The maximum number of cluster nodes of the license key.
                    type: integer
                maxHttpSessions:
                    description:
                        The maximum number of http sessions the license key can handle.
                    type: integer
                maxServers:
                    description:
                        The maximum number of servers of the license key.
                    type: integer
                modifiedDate:
                    description:
                        The last date the license key was modified.
                    format: date-time
                    type: string
                modifiedUserName:
                    description:
                        The name of the user who last modified the license key.
                    type: string
                modifiedUserUuid:
                    description:
                        The uuid of the user who last modified the license key.
                    type: string
                name:
                    description:
                        The name of the license key.
                    type: string
                owner:
                    description:
                        The owner of the license key.
                    type: string
                productId:
                    description:
                        The id of the product of the license key.
                    type: string
                productKey:
                    description:
                        The key of the product of the license key.
                    type: string
                productName:
                    description:
                        The name of the product of the license key.
                    type: string
                productPurchaseKey:
                    description:
                        The key of the license key's product purchase.
                    type: string
                productVersion:
                    description:
                        The version of the product of the license key.
                    type: string
                serverId:
                    description:
                        The id of the server of the license key.
                    type: string
                sizing:
                    description:
                        The sizing of the license key.
                    enum: ["Sizing 1", "Sizing 2", "Sizing 3", "Sizing 4"]
                    type: string
                startDate:
                    description:
                        The date the license key can start being used.
                    format: date-time
                    type: string
                userName:
                    description:
                        The name of the user who created the license key.
                    readOnly: true
                    type: string
                userUuid:
                    description:
                        The uuid of the user who created the license key.
                    readOnly: true
                    type: string
            type: object
        LicenseKeyGenerateForm:
            description:
                Represents the options available during license generation based on account and product.
            properties:
                allowComplimentary:
                    description:
                        If the account can generate complimentary license keys.
                    readOnly: true
                    type: boolean
                allowPermanentLicenses:
                    description:
                        If the account can generate permanent license keys.
                    readOnly: true
                    type: boolean
                subscriptionTerms:
                    description:
                        The subscription terms of the account available to generate the license key on.
                    items:
                        properties:
                            endDate:
                                description:
                                    The date the subscription term ends.
                                format: date-time
                                readOnly: true
                                type: string
                            instanceSize:
                                description:
                                    The size of the instance.
                                readOnly: true
                                type: integer
                            licenseKeyEndDates:
                                description:
                                    The end dates for different license key types.
                                items:
                                    properties:
                                        endDate:
                                            description:
                                                The date the license key ends.
                                            format: date-time
                                            readOnly: true
                                            type: string
                                        licenseEntryType:
                                            description:
                                                The type of the license entry of the license key.
                                            readOnly: true
                                            type: string
                                    type: object
                                readOnly: true
                                type: array
                            perpetual:
                                description:
                                    If the subscription is perpetual.
                                readOnly: true
                                type: boolean
                            productKey:
                                description:
                                    The key of the subscription's product.
                                readOnly: true
                                type: string
                            productPurchaseKey:
                                description:
                                    The key of the subscription's product purchase.
                                readOnly: true
                                type: string
                            provisionedCount:
                                description:
                                    The amount of currently provisioned license keys.
                                readOnly: true
                                type: integer
                            quantity:
                                description:
                                    The quantity of the subscription's purchased product.
                                readOnly: true
                                type: integer
                            startDate:
                                description:
                                    The date the subscription term starts.
                                format: date-time
                                readOnly: true
                                type: string
                        type: object
                    readOnly: true
                    type: array
                versions:
                    description:
                        The versions available to generate the license key for.
                    items:
                        properties:
                            label:
                                description:
                                    The label of the version
                                readOnly: true
                                type: string
                            types:
                                description:
                                    The license types available to generate the license key for.
                                items:
                                    properties:
                                        licenseEntryDisplayName:
                                            description:
                                                The display name of the license entry shown on the UI.
                                            readOnly: true
                                            type: string
                                        licenseEntryName:
                                            description:
                                                The name of the license entry of the license key.
                                            readOnly: true
                                            type: string
                                        licenseEntryType:
                                            description:
                                                The type of the license entry of the license key.
                                            readOnly: true
                                            type: string
                                        productKey:
                                            description:
                                                The key of the license entry product.
                                            readOnly: true
                                            type: string
                                        requiredDetails:
                                            description:
                                                The necessary details from the user to generate this type of license
                                                key. Possible values are "None", "Server Id", "Virtual Cluster".
                                            readOnly: true
                                            type: string
                                    type: object
                                readOnly: true
                                type: array
                        type: object
                    readOnly: true
                    type: array
            type: object
        ProductGroup:
            description:
                The top level of products
            properties:
                name:
                    description:
                        The name of the product group.
                    enum: ["Commerce", "DXP", "Enterprise Search", "Portal"]
                    type: string
            type: object
info:
    description:
        "A Java client JAR is available for use with the group ID 'com.liferay', artifact ID
        'com.liferay.osb.provisioning.rest.client', and version '1.0.0'."
    license:
