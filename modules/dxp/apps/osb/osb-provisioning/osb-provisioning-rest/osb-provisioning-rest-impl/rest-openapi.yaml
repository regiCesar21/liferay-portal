    title: "Provisioning"
    version: v1.0
openapi: 3.0.1
paths:
    "/accounts/{accountKey}/contacts/by-email-address/{contactEmailAddress}/roles":
        delete:
            description:
                Unassigns roles from the contact for the account.
            parameters:
                - in: path
                  name: accountKey
                  required: true
                  schema:
                      type: string
                - in: path
                  name: contactEmailAddress
                  required: true
                  schema:
                      type: string
                - in: query
                  name: contactRoleNames
                  required: true
                  schema:
                      items:
                          type: string
                      type: array
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
            tags: ["Account"]
        put:
            description:
                Assigns roles to the contact for the account.
            parameters:
                - in: path
                  name: accountKey
                  required: true
                  schema:
                      type: string
                - in: path
                  name: contactEmailAddress
                  required: true
                  schema:
                      type: string
                - in: query
                  name: contactRoleNames
                  required: true
                  schema:
                      items:
                          type: string
                      type: array
                - in: query
                  name: firstName
                  schema:
                      type: string
                - in: query
                  name: lastName
                  schema:
                      type: string
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
            tags: ["Account"]
    "/accounts/{accountKey}/license-keys":
        get:
            description:
                Retrieves the account's license keys. Results can be paginated, filtered, searched, and sorted.
            operationId: getAccountAccountKeyLicenseKeysPage
            parameters:
                - in: path
                  name: accountKey
                  required: true
                  schema:
                      type: string
                - in: query
                  name: filter
                  schema:
                      type: string
                - in: query
                  name: page
                  schema:
                      type: integer
                - in: query
                  name: pageSize
                  schema:
                      type: integer
                - in: query
                  name: search
                  schema:
                      type: string
                - in: query
                  name: sort
                  schema:
                      type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/LicenseKey"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/LicenseKey"
                                type: array
            tags: ["LicenseKey"]
        post:
            description:
                Generates license keys for an account.
            operationId: postAccountAccountKeyLicenseKeysPage
            parameters:
                - in: path
                  name: accountKey
                  required: true
                  schema:
                      type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            items:
                                $ref: "#/components/schemas/LicenseKey"
                            type: array
                    application/xml:
                        schema:
                            items:
                                $ref: "#/components/schemas/LicenseKey"
                            type: array
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/LicenseKey"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/LicenseKey"
                                type: array
            tags: ["LicenseKey"]
    "/accounts/{accountKey}/license-keys/export":
        get:
            description:
                Exports a CSV file of the account's license key details. Results can be filtered and sorted.
            operationId: getAccountAccountKeyLicenseKeyExport
            parameters:
                - in: path
                  name: accountKey
                  required: true
                  schema:
                      type: string
                - in: query
                  name: filter
                  schema:
                      type: string
                - in: query
                  name: sort
                  schema:
                      type: string
            responses:
                200:
                    content:
                        text/csv:
                            schema:
                                format: binary
                                type: string
            tags: ["LicenseKey"]
    "/accounts/{accountKey}/product-groups/{productGroupName}/generate-form":
        get:
            description:
                Retrieves the license key generation options for the given account.
            operationId: getAccountAccountKeyProductGroupProductGroupNameGenerateForm
            parameters:
                - in: path
                  name: accountKey
                  required: true
                  schema:
                      type: string
                - in: path
                  name: productGroupName
                  required: true
                  schema:
                      type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/LicenseKeyGenerateForm"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/LicenseKeyGenerateForm"
            tags: ["LicenseKey"]
    "/accounts/{accountKey}/product-groups/{productGroupName}/product-environment/{productEnvironmentName}/common-license-key":
        get:
            description:
                Retrieves the product group's common license based on date and environment.
            parameters:
                - in: path
                  name: accountKey
                  required: true
                  schema:
                      type: string
                - in: path
                  name: productGroupName
                  required: true
                  schema:
                      type: string
                - in: path
                  name: productEnvironmentName
                  required: true
                  schema:
                      type: string
                - in: query
                  name: dateEnd
                  required: true
                  schema:
                      format: date-time
                      type: string
                - in: query
                  name: dateStart
                  required: true
                  schema:
                      format: date-time
                      type: string
            responses:
                200:
                    content:
                        application/octet-stream:
                            schema:
                                format: binary
                                type: string
            tags: ["CommonLicenseKey"]
    "/accounts/{accountKey}/product-groups/{productGroupName}/product-version/{productVersion}/development-license-key":
        get:
            description:
                Downloads the account's product development license key.
            operationId: getAccountAccountKeyProductGroupProductGroupNameProductVersionDevelopmentLicenseKey
            parameters:
                - in: path
                  name: accountKey
                  required: true
                  schema:
                      type: string
                - in: path
                  name: productGroupName
                  required: true
                  schema:
                      type: string
                - in: path
                  name: productVersion
                  required: true
                  schema:
                      type: string
            responses:
                200:
                    content:
                        application/xml:
                            schema:
                                format: binary
                                type: string
            tags: ["LicenseKey"]
    "/accounts/{accountKey}/product/{productKey}/usage":
        get:
            description:
                Gets the max concurrent purchased count and consumed count per year for the previous, current and next
                year. Also includes the current usage at the time of invoking this API.
            operationId: getAccountAccountKeyProductProductKeyUsage
            parameters:
                - in: path
                  name: accountKey
                  required: true
                  schema:
                      type: string
                - in: path
                  name: productKey
                  required: true
                  schema:
                      type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                format: binary
                                type: string
                        application/xml:
                            schema:
                                format: binary
                                type: string
            tags: ["LicenseKey"]
    "/app-license-keys":
        get:
            description:
                Retrieves the app license keys. Results can be paginated, filtered, searched, and sorted.
            operationId: getAppLicenseKeysPage
            parameters:
                - in: query
                  name: filter
                  schema:
                      type: string
                - in: query
                  name: page
                  schema:
                      type: integer
                - in: query
                  name: pageSize
                  schema:
                      type: integer
                - in: query
                  name: search
                  schema:
                      type: string
                - in: query
                  name: sort
                  schema:
                      type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AppLicenseKey"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AppLicenseKey"
                                type: array
            tags: ["AppLicenseKey"]
        post:
            description:
                Generates an app license key.
            operationId: postAppLicenseKey
            parameters:
                - $ref: "#/components/parameters/AgentName"
                - $ref: "#/components/parameters/AgentUID"
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AppLicenseKey"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/AppLicenseKey"
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AppLicenseKey"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/AppLicenseKey"
            tags: ["AppLicenseKey"]
    "/app-license-keys/activate":
        put:
            description:
                Activates app license keys.
            operationId: putAppLicenseKeyActivate
            parameters:
                - $ref: "#/components/parameters/AgentName"
                - $ref: "#/components/parameters/AgentUID"
                - in: query
                  name: appLicenseKeyIds
                  required: true
                  schema:
                      items:
                          format: int64
                          type: integer
                      type: array
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
            tags: ["AppLicenseKey"]
    "/app-license-keys/deactivate":
        put:
            description:
                Deactivates app license keys.
            operationId: putAppLicenseKeyDeactivate
            parameters:
                - $ref: "#/components/parameters/AgentName"
                - $ref: "#/components/parameters/AgentUID"
                - in: query
                  name: appLicenseKeyIds
                  required: true
                  schema:
                      items:
                          format: int64
                          type: integer
                      type: array
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
            tags: ["AppLicenseKey"]
    "/license-keys/activate":
        put:
            description:
                Activates license keys.
            operationId: putLicenseKeyActivate
            parameters:
                - in: query
                  name: licenseKeyIds
                  required: true
                  schema:
                      items:
                          format: int64
                          type: integer
                      type: array
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
            tags: ["LicenseKey"]
    "/license-keys/deactivate":
        put:
            description:
                Deactivates license keys.
            operationId: putLicenseKeyDeactivate
            parameters:
                - in: query
                  name: licenseKeyIds
                  required: true
                  schema:
                      items:
                          format: int64
                          type: integer
                      type: array
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
            tags: ["LicenseKey"]
    "/license-keys/download":
        get:
            description:
                Downloads an aggregated license key of the specified license keys.
            operationId: getLicenseKeyDownload
            parameters:
                - in: query
                  name: licenseKeyIds
                  required: true
                  schema:
                      items:
                          format: int64
                          type: integer
                      type: array
            responses:
                200:
                    content:
                        application/xml:
                            schema:
                                format: binary
                                type: string
            tags: ["LicenseKey"]
    "/license-keys/download-zip":
        get:
            description:
                Downloads a zip file that includes all of the specified license keys.
            operationId: getLicenseKeyDownloadZip
            parameters:
                - in: query
                  name: licenseKeyIds
                  required: true
                  schema:
                      items:
                          format: int64
                          type: integer
                      type: array
            responses:
                200:
                    content:
                        application/zip:
                            schema:
                                format: binary
                                type: string
            tags: ["LicenseKey"]
    "/license-keys/export":
        get:
            description:
                Exports a CSV file of the license key details.
            operationId: getLicenseKeyExport
            parameters:
                - in: query
                  name: licenseKeyIds
                  required: true
                  schema:
                      items:
                          format: int64
                          type: integer
                      type: array
            responses:
                200:
                    content:
                        text/csv:
                            schema:
                                format: binary
                                type: string
            tags: ["LicenseKey"]
    "/license-keys/extend":
        post:
            description:
                Extends license keys.
            operationId: postLicenseKeysExtendPage
            requestBody:
                content:
                    application/json:
                        schema:
                            items:
                                $ref: "#/components/schemas/LicenseKey"
                            type: array
                    application/xml:
                        schema:
                            items:
                                $ref: "#/components/schemas/LicenseKey"
                            type: array
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/LicenseKey"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/LicenseKey"
                                type: array
            tags: ["LicenseKey"]
    "/license-keys/subscriptions":
        delete:
            description:
                Unsubscribes from license keys.
            operationId: deleteLicenseKeySubscription
            parameters:
                - in: query
                  name: licenseKeyIds
                  required: true
                  schema:
                      items:
                          format: int64
                          type: integer
                      type: array
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
            tags: ["LicenseKey"]
        get:
            description:
                Gets the subscriptions to the license keys.
            operationId: getLicenseKeySubscription
            parameters:
                - in: query
                  name: licenseKeyId
                  required: true
                  schema:
                      format: int64
                      type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                type: boolean
                        application/xml:
                            schema:
                                type: boolean
            tags: ["LicenseKey"]
        put:
            description:
                Subscribes to license keys.
            operationId: putLicenseKeySubscription
            parameters:
                - in: query
                  name: licenseKeyIds
                  required: true
                  schema:
                      items:
