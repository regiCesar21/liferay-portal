logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr(%X{osbAsahProjectId:-none}){green} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.security.enabled=false
osb.asah.data.dog.query.response.threshold=10000
osb.asah.security.enabled=true
server.connection-timeout=10000
server.error.include-message=always
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false
server.tomcat.mbeanregistry.enabled=true