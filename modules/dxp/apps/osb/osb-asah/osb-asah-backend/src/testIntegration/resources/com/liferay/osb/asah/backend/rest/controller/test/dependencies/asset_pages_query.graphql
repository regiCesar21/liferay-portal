query AssetsTouchpointQuery($assetId: String!, $assetType: AssetType!, $channelId: String, $devices: String, $location: String, $rangeEnd: String, $rangeKey: Int, $rangeStart: String, $selectedMetrics: [String], $size: Int!, $start: Int!, $title: String) {
	assetPages(assetId: $assetId, assetType: $assetType, channelId: $channelId, country: $location, deviceType: $devices, rangeEnd: $rangeEnd, rangeKey: $rangeKey, rangeStart: $rangeStart, selectedMetrics: $selectedMetrics, size: $size, start: $start, title: $title) {
		assetMetrics {
			assetTitle
			assetId
			selectedMetrics {
				name
				value
			}
		}
		total
	}
}