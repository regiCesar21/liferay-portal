fragment browserFragment on Metric {
	browser {
		value
		valueKey
	}
}

fragment deviceFragment on Metric {
	device {
		metrics {
			value
			valueKey
		}
		value
		valueKey
	}
}

query SiteMetrics($channelId: String, $rangeEnd: String, $rangeKey: Int, $rangeStart: String) {
	site(channelId: $channelId, includePrevious: false, rangeEnd: $rangeEnd, rangeKey: $rangeKey, rangeStart: $rangeStart) {
		sessionsMetric {
			...browserFragment
			...deviceFragment
			value
		}
	}
}