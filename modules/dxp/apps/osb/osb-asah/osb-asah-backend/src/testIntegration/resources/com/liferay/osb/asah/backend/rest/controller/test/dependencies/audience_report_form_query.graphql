fragment audienceReportFragment on Metric {
	audienceReport {
		anonymousUsersCount
		knownUsersCount
		nonsegmentedKnownUsersCount
		segmentedAnonymousUsersCount
		segmentedKnownUsersCount
		__typename
	}
	segment {
		metrics {
			value
			valueKey
			__typename
		}
		total
		__typename
	}
	__typename
}

query formAudienceReportQuery($assetId: String!, $channelId: String, $devices: String, $location: String, $rangeEnd: String, $rangeKey: Int, $rangeStart: String, $title: String, $touchpoint: String) {
	form(
		assetId: $assetId
		canonicalUrl: $touchpoint
		channelId: $channelId
		country: $location
		deviceType: $devices
		rangeEnd: $rangeEnd
		rangeKey: $rangeKey
		rangeStart: $rangeStart
		title: $title
	) {
		submissionsMetric {
			...audienceReportFragment
			__typename
		}
		__typename
	}
}