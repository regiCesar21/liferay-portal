apply plugin: "com.liferay.spring.boot.defaults"
apply plugin: "io.spring.dependency-management"

ext {
	set("junit-jupiter.version", "5.8.2")
	set("log4j2.version", "2.17.0")
}

sourceCompatibility = "1.8"
targetCompatibility = "1.8"

bootJar {
	classifier = "application"
}

configurations.all {
	exclude group: "org.apache.geronimo.bundles", module: "json"
}

dependencies {
	api group: "com.fasterxml.jackson.datatype", name: "jackson-datatype-jdk8", version: "2.13.5"
	api group: "com.fasterxml.jackson.datatype", name: "jackson-datatype-json-org", version: "2.13.5"
	api group: "com.fasterxml.jackson.datatype", name: "jackson-datatype-jsr310", version: "2.13.5"
	api project(configuration: "default", path: ":dxp:apps:osb:osb-asah:osb-asah-common")

	testImplementation project(configuration: "default", path: ":dxp:apps:osb:osb-asah:osb-asah-test-util")
}

jar {
	enabled = true
}