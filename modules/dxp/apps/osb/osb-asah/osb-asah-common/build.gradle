apply plugin: "io.spring.dependency-management"
apply plugin: "org.springframework.boot"

ext {
	set("junit-jupiter.version", "5.11.4")
	set("log4j2.version", "2.17.0")
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

bootJar {
	enabled = false
}

configurations.all {
	exclude group: "com.vaadin.external.google", module: "android-json"
	exclude group: "org.apache.geronimo.bundles", module: "json"
	exclude group: "org.slf4j", module: "slf4j-log4j12"

	resolutionStrategy {
		force group: "org.apache.httpcomponents.core5", name: "httpcore5", version: "5.3.4"
	}
}

dependencies {
	api group: "com.esotericsoftware", name: "kryo", version: "5.2.0"
	api group: "com.fasterxml.jackson.datatype", name: "jackson-datatype-jdk8", version: "2.18.2"
	api group: "com.fasterxml.jackson.datatype", name: "jackson-datatype-json-org", version: "2.18.2"
	api group: "com.fasterxml.jackson.datatype", name: "jackson-datatype-jsr310", version: "2.18.2"
	api group: "com.github.ben-manes.caffeine", name: "caffeine", version: "3.2.0"
	api group: "com.google.cloud", name: "google-cloud-bigquery", version: "2.22.0"
	api group: "com.google.cloud", name: "google-cloud-bigquerydatatransfer", version: "2.60.0"
	api group: "com.google.cloud", name: "google-cloud-bigquerystorage", version: "2.31.0"
	api group: "com.google.cloud", name: "google-cloud-pubsub", version: "1.123.2"
	api group: "com.google.cloud", name: "google-cloud-storage", version: "2.38.0"
	api group: "com.google.protobuf", name: "protobuf-java", version: "3.25.8"
	api group: "com.google.protobuf", name: "protobuf-java-util", version: "3.25.8"
	api group: "com.univocity", name: "univocity-parsers", version: "2.4.1"
	api group: "commons-io", name: "commons-io", version: "2.19.0"
	api group: "commons-logging", name: "commons-logging", version: "1.2"
	api group: "fi.solita.clamav", name: "clamav-client", version: "1.0.1"
	api group: "io.grpc", name: "grpc-netty-shaded", version: "1.70.0"
	api group: "io.lettuce", name: "lettuce-core", version: "6.5.3.RELEASE"
	api group: "io.micrometer", name: "micrometer-registry-prometheus"
	api group: "io.prometheus", name: "simpleclient", version: "0.16.0"
	api group: "jakarta.xml.bind", name: "jakarta.xml.bind-api", version: "4.0.2"
	api group: "org.apache.commons", name: "commons-collections4", version: "4.4"
	api group: "org.apache.commons", name: "commons-lang3", version: "3.7"
	api group: "org.apache.commons", name: "commons-pool2", version: "2.4.3"
	api group: "org.apache.httpcomponents.client5", name: "httpclient5", version: "5.4.4"
	api group: "org.aspectj", name: "aspectjweaver", version: "1.9.6"
	api group: "org.jooq", name: "jooq", version: "3.19.18"
	api group: "org.json", name: "json"
	api group: "org.postgresql", name: "postgresql", version: "42.7.7"
	api group: "org.springframework.boot", name: "spring-boot-starter-actuator"
	api group: "org.springframework.boot", name: "spring-boot-starter-data-jdbc"
	api group: "org.springframework.boot", name: "spring-boot-starter-data-redis"
	api group: "org.springframework.boot", name: "spring-boot-starter-validation"
	api group: "org.springframework.boot", name: "spring-boot-starter-web"
	api group: "org.springframework.retry", name: "spring-retry"
	api project(configuration: "default", path: ":dxp:apps:osb:osb-asah:osb-asah-filter-expression-parser")
	testImplementation group: "io.rest-assured", name: "json-schema-validator", version: "5.5.1"
	testImplementation group: "io.rest-assured", name: "rest-assured", version: "5.5.1"
	testImplementation group: "net.bytebuddy", name: "byte-buddy", version: "1.16.1"
	testImplementation group: "org.skyscreamer", name: "jsonassert", transitive: false
	testImplementation group: "org.springframework.boot", name: "spring-boot-starter-test"
	testImplementation project(configuration: "default", path: ":dxp:apps:osb:osb-asah:osb-asah-test-util")
}

jar {
	enabled = true
}