buildscript {
	dependencies {
		classpath group: "gradle.plugin.com.github.johnrengelman", name: "shadow", version: "7.1.2"
	}

	repositories {
		gradlePluginPortal()

		mavenCentral()
	}
}

apply plugin: 'com.github.johnrengelman.shadow'

ext {
	dbIPVersion = "2025-02"
}

configurations {
	mmdb
}

configurations.all {
	resolutionStrategy.eachDependency {
		DependencyResolveDetails dependencyResolveDetails ->

		if (dependencyResolveDetails.requested.group == 'org.apache.logging.log4j') {
			dependencyResolveDetails.useVersion '2.17.0'
		}
	}
}

dependencies {
	api group: "com.blueconic", name: "browscap-java", version: "latest.release"
	api group: "com.google.cloud.sql", name: "postgres-socket-factory", version: "1.15.2"
	api group: "com.maxmind.geoip2", name: "geoip2", version: "2.16.1"
	api group: "com.opencsv", name: "opencsv", version: "5.10"
	api group: "commons-io", name: "commons-io", version: "2.9.0"
	api group: "org.apache.beam", name: "beam-runners-google-cloud-dataflow-java", version: "2.60.0"
	api group: "org.apache.beam", name: "beam-sdks-java-core", version: "2.60.0"
	api group: "org.apache.beam", name: "beam-sdks-java-extensions-google-cloud-platform-core", version: "2.60.0"
	api group: "org.apache.beam", name: "beam-sdks-java-extensions-json-jackson", version: "2.60.0"
	api group: "org.apache.beam", name: "beam-sdks-java-io-google-cloud-platform", version: "2.60.0"
	api group: "org.apache.beam", name: "beam-sdks-java-io-jdbc", version: "2.60.0"
	api group: "org.apache.commons", name: "commons-lang3", version: "3.7"
	api group: "org.postgresql", name: "postgresql", version: "42.7.5"
	api group: "org.slf4j", name: "slf4j-api", version: "1.7.32"
	mmdb ext: "gz", group: "com.liferay.osb.dbip", name: "dbip.location.mmdb", version: "${dbIPVersion}"
	testImplementation group: "junit", name: "junit", version: "4.13.1"
	testImplementation group: "org.apache.beam", name: "beam-sdks-java-extensions-avro", version: "2.60.0"
	testImplementation group: "org.hamcrest", name: "hamcrest-all", version: "1.3"
	testRuntimeOnly group: "org.apache.beam", name: "beam-runners-direct-java", version: "2.60.0"
	testRuntimeOnly group: "org.junit.vintage", name: "junit-vintage-engine", version: "5.2.0"
}

task execute(type: JavaExec)

execute {
	args System.getProperty("exec.args") ? System.getProperty("exec.args").split() : []
	classpath = sourceSets.main.runtimeClasspath
	main = System.getProperty("exec.mainClass")
}

processResources {
	into("META-INF") {
		from configurations.mmdb

		rename {
			String fileName -> fileName.replace("-${dbIPVersion}", "")
		}
	}
}

repositories {
	maven {
		url "https://packages.confluent.io/maven"
	}

	maven {
		url System.getProperty("repository.private.url")

		credentials {
			username System.getProperty("repository.private.username", System.getenv("REPOSITORY_PRIVATE_USERNAME"))
			password System.getProperty("repository.private.password", System.getenv("REPOSITORY_PRIVATE_PASSWORD"))
		}
	}
}

shadowJar {
	mergeServiceFiles()

	setProperty("zip64", true)
}