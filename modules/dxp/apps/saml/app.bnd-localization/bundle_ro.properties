liferay-releng-app-description=Security Assertion Markup Language 2.0 (SAML 2.0) este o versiune a standardului SAML OASIS pentru transferul de date de autentificare și autorizare între domeniile de securitate. SAML 2.0 este un protocol bazat pe XML care utilizează token-uri de securitate care conțin afirmații pentru a transmite informații despre un mandant (de obicei un utilizator final) între un furnizor de identitate și un serviciu web. SAML 2.0 permite scenarii de autentificare și autorizare bazate pe web, inclusiv autentificarea unică (SSO). Această aplicație permite Liferay să acționeze ca furnizor de identitate SAML 2.0 (IdP) sau furnizor de servicii (SP). Este construită pe OpenSAML și utilizează Java Keystore pentru a furniza certificate/credințe pentru securitate. Odată instalată această aplicație, este necesară o configurare suplimentară pentru a adapta aplicația cu mediul și configurația SAML locală. Vizitați linkul Documentation (Documentare) pentru a afla mai multe despre SAML și opțiunile sale de configurare<br /><br />Furnizori SAML acceptați: PingFederate, ADFS, Shibboleth, Siteminder și OpenAM.