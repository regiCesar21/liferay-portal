liferay-releng-app-description=Conectorul Liferay REST pentru SharePoint permite utilizatorilor să interacționeze cu fișierele din bibliotecile SharePoint din cadrul unei biblioteci Liferay Documents and Media. Această aplicație pune la dispoziție în biblioteca Documents and Media Library un tip de depozit SharePoint pentru montarea bibliotecilor SharePoint. În cadrul unui astfel de depozit, utilizatorii pot vizualiza, adăuga, modifica și muta fișiere și foldere. Aplicația propagă acțiunile efectuate în biblioteca SharePoint către depozitul SharePoint din Biblioteca de documente și media Liferay și viceversa.<br /><br />Iată câteva dintre capacitățile aplicației:<br /><br />* Citirea/scrierea documentelor și a dosarelor<br />* Înregistrarea și retragerea documentelor și anularea înregistrării și retragerii documentelor<br />* Descărcarea documentelor<br />* Mutarea dosarelor și documentelor în cadrul arhivei.<br />* Obținerea istoricului revizuirilor<br />* Revocarea unei revizuiri<br /><br />Conectorul Liferay REST pentru SharePoint:<br /><br />* Funcționează cu SharePoint 2016 și SharePoint Online<br />* Utilizează Azure ACS cu OAuth 2 pentru autorizarea serverului SharePoint (prin urmare, trebuie să activați suportul HTTPS în serverul dvs. de aplicații)<br /><br />Conectați-vă astăzi platforma Liferay Digital Experience Platform cu bibliotecile SharePoint!<br /><br />Schimbare importantă: Numele acestei aplicații a fost schimbat recent. Vă rugăm să vizitați https://help.liferay.com/hc/en-us/articles/360018233992 pentru informații suplimentare privind procedura de instalare.