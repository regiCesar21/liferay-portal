liferay-releng-app-description=Aplicația Liferay SOAP Connector for SharePoint permite utilizatorilor să interacționeze cu fișierele din bibliotecile SharePoint din cadrul aplicației Liferay Documents and Media. Această aplicație pune la dispoziție în biblioteca Documents and Media Library un tip de arhivă SharePoint pentru montarea bibliotecilor SharePoint. În cadrul unei astfel de baze de date, utilizatorii pot vizualiza, adăuga, modifica și muta fișiere și foldere. Aplicația propagă acțiunile efectuate în biblioteca SharePoint către depozitul SharePoint din Biblioteca de documente și media Liferay și viceversa.<br /><br />Iată câteva dintre capacitățile aplicației:<br /><br />* Citirea/scrierea documentelor și a dosarelor<br />* Înregistrarea și retragerea documentelor și anularea înregistrării și retragerii documentelor<br />* Descărcarea documentelor<br />* Mutarea dosarelor și documentelor în cadrul arhivei.<br />* Obținerea istoricului revizuirilor<br />* Revocarea unei revizuiri<br /><br />funcționează cu SharePoint 2013.<br /><br />Conectați-vă astăzi platforma Liferay Digital Experience Platform cu bibliotecile SharePoint!<br /><br />Modificare importantă: Numele acestei aplicații a fost schimbat recent. Vă rugăm să vizitați https://help.liferay.com/hc/en-us/articles/360018233992 pentru informații suplimentare despre procedura de instalare.