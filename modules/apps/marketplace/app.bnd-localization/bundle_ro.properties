liferay-releng-app-description=Liferay Marketplace este o parte integrantă a experienței pe platforma Liferay pentru toți utilizatorii. Abonații Enterprise au, de asemenea, acces exclusiv la aplicațiile Liferay cu abonament prin intermediul Liferay Marketplace. Conectați-vă cu contul dumneavoastră Liferay pentru a parcurge sute de aplicații care să vă ajute să vă construiți afacerea sau să creați o soluție tehnică.