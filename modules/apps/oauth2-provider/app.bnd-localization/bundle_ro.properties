liferay-releng-app-description=Liferay Plugin pentru OAuth 2.0 este un protocol de autorizare standard în domeniu. Utilizatorii pot partaja fără probleme acreditările selectate de pe un alt site web pentru a se conecta la al dvs. Funcționează prin autorizarea accesului fără parolă la porțiuni de resurse deținute de utilizator (cum ar fi o adresă de e-mail, o imagine de profil a utilizatorului sau altceva din contul dvs.) și alte resurse cu permisiune.