liferay-releng-app-description=Cette application permet à Liferay de détecter quels appareil mobile ou système d'exploitation sont utilisés pour une demande donnée et modifie la mise en page/le rendu des pages en fonction de l'appareil détecté. Une fois installé, vous pouvez définir de nouvelles règles relatives aux appareils mobiles et les appliquer aux sites et aux pages individuelles. La proportion d'utilisateurs d'appareils mobiles naviguant sur le Web n'a cessé d'augmenter, il est donc important de pouvoir gérer correctement différents types d'appareils. Par exemple, vous pouvez configurer l'apparence et la convivialité des pages Liferay auxquelles les utilisateurs de smartphones ou de tablettes accèdent différemment de celles auxquelles les utilisateurs de PC accèdent. Les sites et les pages individuelles peuvent être configurés avec n'importe quel nombre de groupes de règles conçus pour décrire un groupe d'appareils. Il peut contenir une ou plusieurs règles décrivant une catégorie d'appareils, tels que tous les appareils Android ou toutes les tablettes iOS. Les groupes de règles peuvent être hiérarchisés pour déterminer lequel sera appliqué à une demande de page donnée. Vous pouvez définir autant de règles que nécessaire pour classer tous les appareils sur lesquels vous souhaitez effectuer des actions. La base de données des appareils de cette application comprend environ 200 000 combinaisons d'appareils (combinaisons d'appareils, de logiciels et de navigateur) et 60 propriétés.<br /><br />Cette application s'installe en tant que service Liferay.