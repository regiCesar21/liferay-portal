liferay-releng-app-description=Deze app stelt Liferay in staat om te detecteren welk mobiel apparaat of besturingssysteem wordt gebruikt voor een verzoek en verandert de lay-out/weergave van pagina's op basis van het gedetecteerde apparaat. Na installatie kunt u nieuwe regels voor mobiele apparaten definiëren en deze toepassen op sites en afzonderlijke pagina's. Het aandeel gebruikers van mobiele apparaten dat op internet surft, neemt gestaag toe, dus het is belangrijk om op de juiste manier met verschillende soorten apparaten om te gaan. U kunt bijvoorbeeld het uiterlijk van Liferay-pagina's die toegankelijk zijn voor voor smartphone- of tabletgebruikers anders configureren dan deze voor pc-gebruikers. Zowel sites als individuele pagina's kunnen worden geconfigureerd met een willekeurig aantal regelgroepen ontworpen om een ​​groep apparaten te beschrijven. U kunt één of meer regels instellen om een categorie apparaten te beschrijven, zoals alle Android-apparaten of alle iOS-tablets. Regelgroepen kunnen prioriteit krijgen om te bepalen welke groepen op een paginaverzoek worden toegepast. U kunt zoveel regels definiëren als u nodig hebt om alle apparaten te classificeren waarvoor u acties wilt ondernemen. De apparaatdatabase in deze app bevat ongeveer 200.000 apparaatcombinaties (apparaat-, software- en browsercombinaties) en 60 eigenschappen.<br /><br />Deze app wordt geïnstalleerd als een Liferay-service.