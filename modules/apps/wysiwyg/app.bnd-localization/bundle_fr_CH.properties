liferay-releng-app-description=Il est recommandé d'utiliser l'application d'affichage de contenu Web au lieu de l'application WYSIWYG. Bien que l'application WYSIWYG fournisse un moyen rapide de créer et de modifier du contenu Web, elle ne fournit aucune métadonnée de suivi telle que des titres, des versions ou des résumés. L'application d'affichage de contenu Web fournit toutes ces fonctionnalités et bien plus encore.