liferay-releng-app-description=Es wird empfohlen, die App "Web Content Display" anstelle der WYSIWYG-App zu verwenden. Während die WYSIWYG-App eine schnelle Möglichkeit zum Erstellen und Bearbeiten von Webinhalten bot, stellte sie keine Metadaten zur Nachverfolgung wie Titel, Versionen oder Zusammenfassungen zur Verfügung. Die Web Content Display-App bietet all diese Funktionen und mehr.