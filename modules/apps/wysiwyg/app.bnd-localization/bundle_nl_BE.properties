liferay-releng-app-description=Het is aanbevolen om de app voor weergave van de webinhoud te gebruiken in plaats van de WYSIWYG-app. Hoewel de WYSIWYG-app een snelle manier biedt om webinhoud te maken en te bewerken, levert deze geen tracking-metagegevens zoals titels, versies of samenvattingen. De app voor weergave van de webinhoud biedt al deze functies en meer.