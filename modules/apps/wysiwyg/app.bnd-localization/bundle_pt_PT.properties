liferay-releng-app-description=Recomenda-se usar o aplicativo Web Content Display em vez do aplicativo WYSIWYG. Embora o aplicativo WYSIWYG forneça uma maneira rápida de criar e editar conteúdo web, ele não fornece nenhum metadado de rastreamento como títulos, versões ou resumos. O aplicativo Web Content Display fornece todos esses recursos e muito mais.