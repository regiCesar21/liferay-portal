test.batch.run.property.query[functional-bundle-tomcat-mysql56-jdk8][test-portal-hotfix-release]=\
    ${test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant]}

test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant]=\
    (portal.acceptance == true) AND \
    (\
        (testray.component.names ~ "Forms") OR \
        (testray.component.names ~ "Site Templates") OR \
        (testray.main.component.name ~ "Forms")\
    )

test.batch.run.property.query[functional-upgrade*-tomcat*-mysql*-jdk8][relevant]=\
    (data.archive.type != "data-archive-calendar") AND \
    (portal.release != "false") AND \
    (testray.main.component.name == "Upgrades FW")

modules.includes.required.functional[relevant]=apps/web-experience/journal

modules.includes.required.test.batch.class.names.includes[relevant]=\
    apps/collaboration/document-library/document-library-test/**/*Test.java,\
    apps/web-experience/journal/journal-test/**/*Test.java