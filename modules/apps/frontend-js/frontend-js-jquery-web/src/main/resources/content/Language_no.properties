frontend-js-jquery-description=Ved å aktivere JQuery blir biblioteket tilgjengelig på det globale objektet som window.$ i tillegg til AUI.$ innenfor AlloyUI-navneromet. Aktiver denne innstillingen dersom du har behov for dette. For at endringer gjort her skal tre i kraft, må du laste nettlesersiden på ny.