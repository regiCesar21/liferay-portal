enable-aui-preload=โหลดล่วงหน้าโมดูล AUI ที่ใช้กันอย่างแพร่หลาย
enable-aui-preload-description=การโหลดโมดูล AUI ที่ใช้กันอย่างแพร่หลายจะทำให้สามารถใช้งานได้ทันทีที่มีการโหลดหน้าเว็บ ทำให้ไม่จำเป็นที่จะต้องดึงโมดูลจากเซิร์ฟเวอร์ในการร้องขอในภายหลัง
frontend-js-aui-configuration-description=การตั้งค่าในการกำหนดค่านี้ช่วยให้คุณควบคุมเวลาและวิธีโหลด AUI สำหรับความเข้ากันได้แบบย้อนหลัง เพื่อให้การเปลี่ยนแปลงที่ทำขึ้นที่นี่เกิดผล คุณต้องโหลดหน้าเบราว์เซอร์อีกครั้งหลังจากบันทึก
frontend-js-aui-configuration-name=AUI