liferay-releng-app-description=Diese Flash-App ermöglicht das einfache Veröffentlichen von Adobe Flash-Inhalten in Liferay. Die Flash-Quelldatei kann über eine URL angegeben werden, sodass es möglich ist, Videos, Präsentationen und Spiele von einer Remotewebsite oder direkt aus der Dokumenten- und Mediengalerie von Liferay zu veröffentlichen.<br /><br />Diese App wird nach der Installation in Ihrem Anwendungsmenü angezeigt.