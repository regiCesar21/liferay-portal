liferay-releng-app-description=Deze Flash-app maakt het eenvoudig om Adobe Flash-inhoud in Liferay te publiceren. Het Flash-bronbestand kan worden gespecificeerd via een URL, zodat het mogelijk is om video's, presentaties of games te publiceren vanaf een externe website of rechtstreeks vanuit Liferay's Documenten en Media-galerij.<br /><br />Deze app verschijnt na de installatie in uw applicatiemenu.