liferay-releng-app-description=Cette application Flash permet de publier facilement du contenu Adobe Flash dans Liferay. Le fichier source Flash peut être spécifié via une URL afin qu'il soit possible de publier des vidéos, des présentations, des jeux, à partir d'un site Web distant ou directement à partir des documents et de la galerie média de Liferay.<br /><br />Cette application apparaîtra dans votre application menu une fois installée.