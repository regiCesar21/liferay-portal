liferay-releng-app-description=Este aplicativo Flash facilita a publicação de conteúdo Adobe Flash no Liferay. O arquivo com fonte Flash pode ser especificado via URL para que seja possível publicar vídeos, apresentações, jogos, de um site remoto ou diretamente de documentos Liferay e galeria de mídia.<br /><br />Este aplicativo aparecerá no menu do seu aplicativo quando instalado.