liferay-releng-app-description=Aplicația Sync Connector le permite utilizatorilor să se conecteze la portalurile lor din clienții Liferay Sync pentru desktop și mobil. De asemenea, le permite administratorilor să controleze modul în care acești clienți interacționează cu portalul lor. Odată instalată, aplicația Sync Connector oferă serviciile de portal necesare clienților. Nu este necesară nicio configurare suplimentară a portalului. Cu toate acestea, administratorii portalului pot utiliza portlet-ul Sync Admin instalat cu această aplicație pentru a controla ce site-uri sunt disponibile pentru Sync. De asemenea, aceștia pot utiliza acest portlet pentru a dezactiva Sync în portal.<br /><br />După instalare, portlet-ul Sync Admin este disponibil în secțiunea de configurare a panoului de control.<br /><br />Vă rugăm să vizitați http://www.liferay.com/products/liferay-sync/features pentru mai multe informații despre descărcarea clienților Liferay Sync pentru desktop și mobil. Liferay Sync este compatibil cu Windows, Mac OS, iOS și Android. Aplicația Sync Connector necesită versiunea 3.0+ a clientului Sync desktop sau mobil.