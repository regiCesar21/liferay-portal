liferay-releng-app-description=Aplicația Liferay Push expune un sistem care le permite dezvoltatorilor să trimită notificări push din Liferay către aplicațiile native Android și iOS. Prin utilizarea Liferay Push, vă puteți asigura că utilizatorii dvs. sunt la curent cu cele mai recente informații din aplicația Liferay, oriunde s-ar afla. Push funcționează, de asemenea, fără probleme cu Liferay Screens. Instalarea aplicației Liferay Push expune automat cadrul său de push. Această aplicație conține, de asemenea, un portlet Control Panel pe care îl puteți utiliza pentru a trimite notificări push de testare.