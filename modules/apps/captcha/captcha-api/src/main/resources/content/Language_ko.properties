captcha-engine=CAPTCHA 엔진
captcha-engine-help=보안 코드를 생성할 엔진을 설정합니다. reCAPTCHA는 별도로 설정해야 하는 외부 서비스를 사용하지만 시각에 어려움이 있는 사용자들에게 오디오 대체 코드를 제공합니다. 자세한 내용은 https://www.google.com/recaptcha/admin/create 을 참조하십시오.
create-account-captcha-enabled=계정 생성 CAPTCHA 활성
max-challenges=최대 도전
max-challenges-help=포틀릿 세션당 최대 캡차 검사 수를 설정합니다. 항상 확인하려면 이 값을 0으로 설정합니다. 확인하지 않으려면 이 값을 0보다 작은 숫자로 설정하십시오. 인증되지 않은 사용자는 captcha 확인이 활성화된 경우 모든 요청에서 항상 확인됩니다.
message-boards-edit-category-captcha-enabled=메시지 게시판 범주 편집 CAPTCHA 사용
message-boards-edit-message-captcha-enabled=메시지 게시판 메시지 편집 CAPTCHA 사용
recaptcha-no-script-url=reCAPTCHA No Script URL
recaptcha-private-key=reCAPTCHA 개인 키
recaptcha-public-key=reCAPTCHA 공개 키
recaptcha-script-url=reCAPTCHA Script URL
recaptcha-verify-url=reCAPTCHA Verify URL
send-password-captcha-enabled=암호 CAPTCHA 보내기 활성화됨
simple-captcha-background-producers=간단한 CAPTCHA 배경 생산자
simple-captcha-background-producers-help=nl.captcha.backgrounds.BackgroundProducer를 구현하는 클래스 이름을 입력합니다. 이러한 클래스는 보안 문자 이미지의 배경을 생성하기 위해 단순 보안 문자에서 무작위로 사용됩니다.
simple-captcha-gimpy-renderers=단순 CAPTCHA Gimpy 렌더러
simple-captcha-gimpy-renderers-help=nl.captcha.gimpy.GimpyRenderer를 구현하는 클래스 이름을 입력합니다. 이러한 클래스는 보안 문자 이미지를 김프하기 위해 Simple CAPTCHA에서 무작위로 사용됩니다.
simple-captcha-height=단순 CAPTCHA 높이
simple-captcha-height-help=Simple CAPTCHA로 생성된 captcha 이미지의 높이를 설정합니다.
simple-captcha-noise-producers=단순 CAPTCHAR Noise 생산자
simple-captcha-noise-producers-help=nl.captcha.noise.NoiseProducer를 구현하는 클래스 이름을 입력합니다. 이러한 클래스는 보안 문자 이미지에 노이즈를 추가하기 위해 단순 보안 문자에서 무작위로 사용됩니다.
simple-captcha-text-producers=단순 CAPTCHA 텍스트 생산자
simple-captcha-text-producers-help=nl.captcha.text.producer.TextProducer를 구현하는 클래스 이름을 입력합니다. 이러한 클래스는 보안 문자 이미지용 텍스트를 생성하기 위해 단순 보안 문자에서 무작위로 사용됩니다.
simple-captcha-width=단순 CAPTCHA 너비
simple-captcha-width-help=Simple CAPTCHA에 의해 생성된 captcha 이미지의 너비를 설정합니다.
simple-captcha-word-renderers=단순 CAPTCHA 단어 렌더러
simple-captcha-word-renderers-help=nl.captcha.text.renderer.WordRenderer를 구현하는 클래스 이름을 입력합니다. 이러한 클래스는 보안 문자 이미지용 텍스트를 렌더링하기 위해 단순 보안 문자에서 무작위로 사용됩니다.
the-recaptcha-private-key-is-not-valid=reCAPTCHA 비공개 키가 유효하지 않습니다.
the-recaptcha-public-key-is-not-valid=reCAPTCHA 공개 키가 유효하지 않습니다.