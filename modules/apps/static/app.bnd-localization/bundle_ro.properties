liferay-releng-app-description=Aplicația Static conține un grup important de extensii și utilități pe care Liferay le instalează static înainte de a instala orice module OSGi dinamice. Funcționalitatea aplicației include un extender log4j, un extender OSGi WAB, utilități de configurare, utilități de implementare OSGi, indexarea platformei țintă și multe altele.<br /><br />Această suită este disponibilă în pachetul ${liferay.releng.app.title.prefix}.