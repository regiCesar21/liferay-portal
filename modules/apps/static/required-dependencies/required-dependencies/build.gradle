import com.liferay.gradle.util.copy.RenameDependencyClosure

task deployReqTestLibs(type: Copy)

configurations {
	compileOnly {
		transitive = false
	}

	reqTestLibs {
		transitive = false
	}
}

dependencies {
	compileOnly group: "com.fasterxml.jackson.core", name: "jackson-annotations", version: "2.13.4"
	compileOnly group: "com.fasterxml.jackson.core", name: "jackson-core", version: "2.13.4"
	compileOnly group: "com.fasterxml.jackson.core", name: "jackson-databind", version: "2.13.4.2"
	compileOnly group: "com.liferay", name: "com.sun.el.javax.el", version: "3.0.1.LIFERAY-PATCHED-1"
	compileOnly group: "com.liferay", name: "javax.servlet.jsp.jstl", version: "1.2.3.LIFERAY-PATCHED-2"
	compileOnly group: "com.liferay", name: "org.apache.felix.configadmin", version: "1.8.8.LIFERAY-PATCHED-1"
	compileOnly group: "com.liferay", name: "org.apache.felix.fileinstall", version: "3.5.4.LIFERAY-PATCHED-4"
	compileOnly group: "com.liferay", name: "org.apache.felix.scr", version: "2.0.6.LIFERAY-PATCHED-5"
	compileOnly group: "com.liferay", name: "org.eclipse.equinox.console", version: "1.1.100-20150308.220103-2-LIFERAY-CACHED"
	compileOnly group: "com.liferay", name: "org.eclipse.equinox.metatype", version: "1.4.200-20150831.175616-1-LIFERAY-CACHED"
	compileOnly group: "com.liferay", name: "org.osgi.service.http", version: "3.5.0-20150611.165350-3.LIFERAY-PATCHED-2"
	compileOnly group: "javax.servlet.jsp", name: "javax.servlet.jsp-api", version: "2.3.2-b01"
	compileOnly group: "javax.servlet.jsp.jstl", name: "javax.servlet.jsp.jstl-api", version: "1.2.2"
	compileOnly group: "org.apache.felix", name: "org.apache.felix.dependencymanager", version: "3.2.0"
	compileOnly group: "org.apache.felix", name: "org.apache.felix.dependencymanager.shell", version: "3.2.0"
	compileOnly group: "org.apache.felix", name: "org.apache.felix.eventadmin", version: "1.4.6"
	compileOnly group: "org.apache.felix", name: "org.apache.felix.gogo.command", version: "0.12.0"
	compileOnly group: "org.apache.felix", name: "org.apache.felix.gogo.runtime", version: "0.10.0"
	compileOnly group: "org.apache.felix", name: "org.apache.felix.gogo.shell", version: "0.10.0"
	compileOnly group: "org.apache.felix", name: "org.apache.felix.log", version: "1.2.0"
	compileOnly group: "org.jsoup", name: "jsoup", version: "1.15.3"
	compileOnly group: "org.osgi", name: "org.osgi.service.metatype", version: "1.3.0"
	reqTestLibs group: "com.liferay", name: "com.liferay.arquillian.extension.junit.bridge.connector", version: "1.0.0"
}

deploy {
	setActions([])

	dependsOn = []
	finalizedBy deployReqTestLibs
}

deployDependencies {
	from configurations.compileOnly
	rename(/com.sun.el.javax.el-(.+)\.jar/, "javax.el" + renameSuffix)
}

deployReqTestLibs {
	ext {
		autoClean = false
	}

	from configurations.reqTestLibs

	into {
		"${liferay.liferayHome}/osgi/test"
	}

	outputs.upToDateWhen {
		false
	}

	rename new RenameDependencyClosure(project, configurations.reqTestLibs.name)
}