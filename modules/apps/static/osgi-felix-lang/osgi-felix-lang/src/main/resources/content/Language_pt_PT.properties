ds-delayed-keepInstances=Keep Component Instances (Automatic Copy)
ds-delayed-keepInstances-help=Configure se quiser manter ou não as instâncias dos componentes atrasados quando eles não forem mais indicados. As especificações dos Declarative Services sugerem que as instâncias dos componentes atrasados são eliminadas se não forem mais usadas. Ao estabelecer este sinalizador, os componentes não serão eliminados e, desta forma, não serão recriado constantemente se usado com frequência. Alguns exemplos destes componentes podem ser os serviços de EventHandle. Como padrão os componentes não utilizados são eliminados.
ds-factory-enabled=Extended Factory Components (Automatic Copy)
ds-factory-enabled-help=Configure quando habilitar ou não o suporte para a criação de instâncias do Factory Component com base na configuração de fábrica. Esta é uma extensão específica Apache Felix SCR, explicitamente não suportado pelas especificações do Declarative Services. A confiança neste recursos evita que o componente seja usado com outros implementos do Declarative Services. O valor padrão é falso para desativar este recurso.
ds-global-extender=Global Extender (Automatic Copy)
ds-global-extender-help=Configure whether to extend all bundles, which are visible or not to this bundle, to this bundle. (Automatic Copy)
ds-lock-timeout-milliseconds=Lock Timeout Milliseconds (Automatic Copy)
ds-lock-timeout-milliseconds-help=Configure how long a lock is held before releasing due to suspected deadlock. (Automatic Copy)
ds-loglevel=SCR Log Level (Automatic Copy)
ds-loglevel-help=Configure the log level to limit the amount of logging information sent to the OSGi LogService. Supported values are DEBUG, INFO, WARN, and ERROR. This property is not used if a R7 LogService implementation is available as the log level can be configured through that service. The default value is ERROR. (Automatic Copy)
ds-stop-timeout-milliseconds=Stop Timeout Milliseconds (Automatic Copy)
ds-stop-timeout-milliseconds-help=Configure how long to wait for a bundle to stop before continuing due to suspected deadlock. (Automatic Copy)
