org-apache-felix-scr-ScrService-ocd-help=Configure a implementação dos Serviços Declarativos Apache Felix. Esta configuração substitui a configuração definida em propriedades de estrutura dos mesmos nomes. (Automatic Translation)
org-apache-felix-scr-ScrService-ocd-name=Implementação do Serviço Declarativo Apache Felix (Automatic Translation)