ds-delayed-keepInstances=Keep Component Instances (Automatic Copy)
ds-delayed-keepInstances-help=Configureer of u al dan niet instanties van uitgestelde componenten wilt behouden zodra er niet meer naar wordt verwezen. De specificaties voor declaratiediensten stellen dat instanties van uitgestelde componenten worden verwijderd wanneer ze niet meer worden gebruikt. Door deze markering in te stellen, worden de componenten niet verwijderd en worden ze niet constant opnieuw gemaakt als ze vaak worden gebruikt. EventHandler-services zijn een voorbeeld van dergelijke componenten. Standaard worden ongebruikte componenten verwijderd.
ds-factory-enabled=Extended Factory Components (Automatic Copy)
ds-factory-enabled-help=Configureer of u al dan niet ondersteuning voor het maken van instanties van fabriekscomponenten op basis van de fabrieksconfiguratie wilt inschakelen. Dit is een specifieke extensie van Apache Felix SCR en wordt uitdrukkelijk niet ondersteund door de specificaties voor declaratiediensten. Deze functie voorkomt dat de component wordt gebruikt met andere implementaties van declaratiediensten. De standaardwaarde is onwaar om deze functie uit te schakelen.
ds-global-extender=Global Extender (Automatic Copy)
ds-global-extender-help=Configure whether to extend all bundles, which are visible or not to this bundle, to this bundle. (Automatic Copy)
ds-lock-timeout-milliseconds=Lock Timeout Milliseconds (Automatic Copy)
ds-lock-timeout-milliseconds-help=Configure how long a lock is held before releasing due to suspected deadlock. (Automatic Copy)
ds-loglevel=SCR Log Level (Automatic Copy)
ds-loglevel-help=Configure the log level to limit the amount of logging information sent to the OSGi LogService. Supported values are DEBUG, INFO, WARN, and ERROR. This property is not used if a R7 LogService implementation is available as the log level can be configured through that service. The default value is ERROR. (Automatic Copy)
ds-stop-timeout-milliseconds=Stop Timeout Milliseconds (Automatic Copy)
ds-stop-timeout-milliseconds-help=Configure how long to wait for a bundle to stop before continuing due to suspected deadlock. (Automatic Copy)
felix-fileinstall-bundles-new-start=Start New Bundles (Automatic Copy)
felix-fileinstall-bundles-startActivationPolicy=Use the Bundle Activation Policy When Starting (Automatic Copy)
felix-fileinstall-bundles-startTransient=Start Bundles Transiently (Automatic Copy)
felix-fileinstall-dir=Poll Directory (Automatic Copy)
felix-fileinstall-filter=File Name Filter (Automatic Copy)
felix-fileinstall-log-level=Log Level (Automatic Copy)
felix-fileinstall-noInitialDelay=No Initial Delay (Automatic Copy)
felix-fileinstall-poll=Poll interval (Automatic Copy)
felix-fileinstall-start-level=Bundles Start Level (Automatic Copy)
felix-fileinstall-tmpdir=Temp Directory (Automatic Copy)
org-apache-felix-eventadmin-AsyncToSyncThreadRatio=Async/Sync Thread Pool Ratio (Automatic Copy)
org-apache-felix-eventadmin-AsyncToSyncThreadRatio-help=Configure the ratio of asynchronous to synchronous threads in the internal thread pool. Ratio must be positive and may be adjusted to represent the distribution of post to send operations. Applications with a higher number of post operations should have a higher ratio. (Automatic Copy)
org-apache-felix-eventadmin-IgnoreTimeout=Ignore Timeouts (Automatic Copy)
org-apache-felix-eventadmin-IgnoreTimeout-help=Configure event handlers to be called without a timeout. If a timeout is configured by default, then all event handlers are called using the timeout. For performance optimization, it is possible to configure event handlers where the timeout handling is not used. This reduces the thread usage from the thread pools as the timeout handling requires an additional thread to call the event handler. However, the application should work without this configuration property. It is a pure optimization. The value is a list of strings. If a string ends with a dot, all handlers in exactly this package are ignored. If the string ends with a star, all handlers in this package and all subpackages are ignored. If the string neither ends with a dot nor with a star, this is assumed to define an exact class name. (Automatic Copy)
org-apache-felix-eventadmin-IgnoreTopic=Ignore Topics (Automatic Copy)
org-apache-felix-eventadmin-IgnoreTopic-help=Configureer onderwerpen die genegeerd worden door de implementatie van het gebeurtenisbeheer voor geoptimaliseerde prestaties. In dit geval wordt geen gebeurtenis geleverd aan geregistreerde gebeurtenisbeheerders. De waarde is een lijst van tekenreeksen (gescheiden door een komma). Als een enkele waarde eindigt met een punt, worden alle onderwerpen in dit pakket en alle onderliggende pakketten genegeerd. Als een enkele waarde noch met een punt, noch met een asterisk eindigt, is dit verondersteld een exacte onderwerp te definiëren. Een enkele asterisk kan worden gebruikt om de levering volledig uit te schakelen.
org-apache-felix-eventadmin-RequireTopic=Require Topic (Automatic Copy)
org-apache-felix-eventadmin-RequireTopic-help=Configure whether event handlers are required to be registered with a topic. This is enabled by default. The specification says that event handlers must register with a list of topics they are interested in. Disabling this setting will enable that handlers without a topic are receiving all events (i.e., they are treated the same as with a topic=*). (Automatic Copy)
org-apache-felix-eventadmin-ThreadPoolSize=Thread Pool Size (Automatic Copy)
org-apache-felix-eventadmin-ThreadPoolSize-help=Configureer de grootte van de threadpool voor levering van gebeurtenissen. De standaardwaarde is 20. Verhoog deze waarde bij een groot aantal gebeurtenissen. Een waarde kleiner dan 2 activeert de standaardwaarde. Als de pool leeg is, wordt de levering van gebeurtenissen geblokkeerd tot een thread van de pool beschikbaar is. Elke gebeurtenis wordt geleverd in een thread van de pool, tenzij de time-outs voor 'negeren' geconfigureerd zijn voor de gebeurtenisbeheerder die ontvangt.
org-apache-felix-eventadmin-Timeout=Timeout (Automatic Copy)
org-apache-felix-eventadmin-Timeout-help=Configureer de time-out voor de zwarte lijst in milliseconden. De standaardwaarde is 5.000. Verhoog of verlaag deze waarde naar wens. Een waarde van minder dan 100 schakelt time-outs uit. Elke andere waarde is de tijd in milliseconden waarover elke gebeurtenisbeheerder beschikt voordat deze op de zwarte lijst komt.
org-apache-felix-eventadmin-ocd-help=Configure for the Apache Felix Event Admin implementation. This configuration overwrites configuration defined in framework properties of the same names. (Automatic Copy)
org-apache-felix-eventadmin-ocd-name=Apache Felix Event Admin Implementation (Automatic Copy)
org-apache-felix-fileinstall-ocd-name=Apache Felix File Install (Automatic Copy)
org-apache-felix-scr-ScrService-ocd-help=Configure the Apache Felix Declarative Services implementation. This configuration overwrites configuration defined in framework properties of the same names. (Automatic Copy)
org-apache-felix-scr-ScrService-ocd-name=Apache Felix Declarative Service Implementation (Automatic Copy)