combine-assets-from-all-segments-in-asset-publisher-dynamic-description=แอสเซ็ท พับลิชเชอร์ตั้งค่าใน dynamic collection mode จะรวมรายการคอลเล็คชั่นจากเซกเมนต์ทั้งหมดที่เกี่ยวข้องกับผู้ใช้งานปัจจุบัน ไม่เพียงแค่อันที่เกี่ยวข้องมากที่สุดโดยอ้างอิงตามค่าเริ่มต้น ตั้งค่าส่วนนี้เป็น true อาจทำให้แอสเซ็ท พับลิชเชอร์แสดงการตอบรับล่าช้า เมื่อแสดงแอสเซทสำหรับผู้ใช้ที่เกี่ยวข้องกับหลายเซกเมนต์
