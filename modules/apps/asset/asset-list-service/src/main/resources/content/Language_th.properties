combine-assets-from-all-segments-in-asset-publisher-manual-description=แอสเซ็ท พับลิชเชอร์ตั้งค่าใน manual collection mode จะรวมรายการคอลเลคชั่นจากเซกเมนต์ทั้งหมดที่เกี่ยวข้องกับผู้ใช้ปัจจุบัน ไม่เพียงแค่อันที่เกี่ยวข้องที่สุดโดยอ้างอิงจากค่าเริ่มต้น