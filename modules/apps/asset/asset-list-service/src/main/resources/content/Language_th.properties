asset-list-configuration-name=คอลเลคชัน
combine-assets-from-all-segments-in-asset-publisher-dynamic=รวมเนื้อหาจากทุกกลุ่มในผู้เผยแพร่เนื้อหาสําหรับชุดเนื้อหาแบบไดนามิก (Automatic Translation)
combine-assets-from-all-segments-in-asset-publisher-dynamic-description=Publisher สินทรัพย์ที่กําหนดค่าในโหมดชุดเนื้อหาแบบไดนามิกจะรวมรายการชุดเนื้อหาจากเซ็กเมนต์ทั้งหมดที่สอดคล้องกับผู้ใช้ปัจจุบันไม่เพียง แต่จากหนึ่งที่เกี่ยวข้องมากที่สุดตามตามค่าเริ่มต้น การตั้งค่านี้เป็น true อาจทําให้ผู้เผยแพร่เนื้อหาแสดงการตอบสนองล่าช้าเมื่อแสดงสินทรัพย์สําหรับผู้ใช้ที่เป็นของเซ็กเมนต์จํานวนมาก (Automatic Translation)
combine-assets-from-all-segments-in-asset-publisher-manual=รวมเนื้อหาจากทุกกลุ่มในผู้เผยแพร่เนื้อหาสําหรับชุดเนื้อหาด้วยตนเอง (Automatic Translation)
combine-assets-from-all-segments-in-asset-publisher-manual-description=ผู้เผยแพร่เนื้อหาที่กําหนดค่าในโหมดชุดเนื้อหาด้วยตนเองจะรวมรายการชุดเนื้อหาจากเซ็กเมนต์ทั้งหมดที่สอดคล้องกับผู้ใช้ปัจจุบัน (Automatic Translation)