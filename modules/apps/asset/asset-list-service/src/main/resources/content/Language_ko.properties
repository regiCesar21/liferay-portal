combine-assets-from-all-segments-in-asset-publisher-dynamic-description=동적 컬렉션 모드로 구성된 애셋 퍼블리셔는 기본적으로 가장 관련성이 높은 세그먼트도 포함하여 현재 사용자에 해당하는 모든 세그먼트의 컬렉션 항목을 결합합니다. 이 값을 true로 설정하면 여러 세그먼트에 속한 사용자의 애셋을 표시할 때 애셋 퍼블리셔가 응답이 지연될 수 있습니다.
