check-token=이미지 토큰 검사
maximum-height=최대 높이
maximum-width=최대 폭
organizations-types-help=이 JSON 개체를 설정하여 조직 유형을 변경합니다. JSON 개체에 새 속성을 추가하여 새 조직 유형을 만듭니다.
use-initials-for-default-user-portrait=기본 사용자 초상화에 이니셜 사용
use-initials-for-default-user-portrait-help=사용자의 이니셜을 기본 사용자 초상화로 설정하려면 활성화합니다. 그렇지 않으면 기본 세로 이미지 파일이 사용됩니다. 기본 세로 이미지 경로는 Portal.properties의 "image.default.user.portrait" 속성으로 설정됩니다.
user-file-uploads-configuration-name=사용자 심상
users-image-check-token-help=이미지 토큰을 표시하기 전에 확인할 수 있습니다.
users-image-maximum-file-size-help=사용자 초상화의 최대 파일 크기를 바이트 단위로 설정합니다. 값 0은 제한이 없음을 나타냅니다. 여기에 입력한 값과 관계없이 업로드된 파일은 시스템 설정 > 인프라 > 서블릿 요청 업로드에서 설정한 "최대 크기"를 초과할 수 없습니다.
users-image-maximum-height-help=최대 사용자 세로 높이를 픽셀 단위로 설정합니다. 값 0은 사용자 세로 크기에 제한이 없음을 나타냅니다.
users-image-maximum-width-help=최대 사용자 세로 너비를 픽셀 단위로 설정합니다. 값 0은 사용자 세로 크기에 제한이 없음을 나타냅니다.