network-host=เน็ทเวิร์คโฮสท์
network-host-help=ชื่อโฮสต์หรือที่อยู่ IP ที่ผูกกับโหนด ซึ่งใช้ในการเผยแพร่ (โฆษณา) โฮสต์ไปยังโหนดอื่นในคลัสเตอร์ นี่คือทางลัดที่ตั้งค่าการผูกโฮสต์และโฮสต์การเผยแพร่ในเวลาเดียวกัน
