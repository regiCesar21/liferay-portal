http-cors-enabled-help=หากเลือกตัวเลือกนี้ การแบ่งปันทรัพยากรข้ามแหล่งจะเปิดใช้งาน ซึ่งจะกำหนดว่าเบราว์เซอร์บนแหล่งอื่นสามารถส่งคำขอไปยัง Elasticsearch ได้หรือไม่ หากปิดใช้งาน เครื่องมือเว็บฟรอนต์เอนด์ เช่น elasticsearch-head อาจไม่สามารถเชื่อมต่อได้
