sync-search=การค้นหาที่ปรับให้ตรงกัน (Automatic Translation)
sync-search-help=ถ้าเลือกนี้ การค้นหาจะทํางานบนเธรดตัวเรียกมากกว่าในพูลเธรดการค้นหาของ Elasticsearch สิ่งนี้ใช้กับโหมดการทํางานแบบฝังตัวเท่านั้น (Automatic Translation)
transport-addresses=ที่อยู่สําหรับการขนส่ง (Automatic Translation)
