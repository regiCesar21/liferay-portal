operation-mode=โหมดการทํางาน (Automatic Translation)
operation-mode-help=โหมดการทํางานระยะไกลเชื่อมต่อกับคลัสเตอร์ Elasticsearch แบบสแตนด์อโลนระยะไกล โหมดการดําเนินการ EMBEDDED เริ่มต้นพอร์ทัลด้วยอินสแตนซ์ Elasticsearch ภายในใน JVM เดียวกัน โหมดการดําเนินการ EMBEDDED ไม่ได้รับการสนับสนุน (Automatic Translation)
override-type-mappings=แทนที่การแม็ปชนิด (Automatic Translation)
override-type-mappings-help=แทนที่การแมปสําหรับ LiferayDocumentType ทั้งหมดในรูปแบบ JSON (Elasticsearch Put Mapping API) ถ้าคุณตั้งค่านี้ การสร้างดัชนีจะละเว้นข้อกําหนดการแม็ปเริ่มต้นและจุดส่วนขยายใดๆ โดยใช้ข้อกําหนดการแม็ปอื่นนี้แทน ใช้ตัวเลือกนี้ถ้าคุณต้องการให้ LiferayDocumentType ถูกสร้างขึ้นด้วยการแม็ปที่ไม่ได้มาตรฐานสําหรับฟิลด์เริ่มต้น ถ้าคุณเพียงต้องการเพิ่มการแม็ปแบบกําหนดเองใหม่โดยไม่ซ้อนทับค่าเริ่มต้นใดๆ ให้ใช้TypeMappings เพิ่มเติม (Automatic Translation)
retry-on-conflict=ลองใหม่เมื่อขัดแย้ง (Automatic Translation)
