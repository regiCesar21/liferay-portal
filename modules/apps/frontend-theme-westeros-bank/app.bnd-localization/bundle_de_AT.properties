liferay-releng-app-description=Westeros Bank ist ein minimalistisches Theme, das von bestehenden Bank-Websites inspiriert wurde. Es bietet eine solide Grundlage, um mit Ihrer Finanzseite zu beginnen. Westeros Bank sorgt nur für den erforderlichen Overhead, sodass Sie ganz einfach Ihre benutzerdefinierten Erlebnisse darauf aufbauen können.<br /><br />Das Westeros Bank-Theme enthält diese nützlichen Funktionen:<ul><li>Strukturierte Inhalte, um elegante Layouts für verschiedene Anwendungsfälle zu erstellen</li><li>Anpassbare Navigationsplatzhalter, mit denen Sie ein differenziertes Navigationserlebnis erstellen können</li></ul>Hinweis: Sobald dieses Theme installiert ist, können Sie über die Systemsteuerung als Site-Vorlage darauf zugreifen.