liferay-releng-app-description=Westeros Bank is een minimalistisch thema geïnspireerd op bestaande banksites. Het biedt een solide basis om aan de slag te gaan met uw financiële site. Westeros Bank introduceert alleen alleen de noodzakelijke structuur waarop u gemakkelijk uw eigen ervaringen kunt bouwen.<br /><br />Het thema Westeros Bank voorziet de volgende handige functies:<ul><li>Gestructureerde inhoud om elegante lay-outs te maken voor verschillende gebruiksscenario's</li><li>Aanpasbare tijdelijke aanduidingen voor navigatie waarmee u een verfijnde navigatie-ervaring kunt creëren</li></ul>Opmerking: na installatie van dit thema kunt u het openen als een sitesjabloon via het configuratiescherm.