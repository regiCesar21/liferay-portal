liferay-releng-app-description=Westeros Bank é um tema minimalista inspirado nos sites de bancos já existentes. Ele fornece uma base sólida para que você inicie seu site financeiro. Westeros Bank introduz apenas as despesas gerais necessárias, facilitando para você a construção de suas experiências personalizadas sobre elas.<br /><br />O tema da Cisjordânia inclui os seguintes recursos úteis:<ul><li>Conteúdo estruturado para criar layouts elegantes para vários casos de uso</li><li>Marcadores de posição de navegação Personalizáveis ​​que permitem criar um experiência de navegação detalhadamente refinada</li></ul>Nota: Uma vez que este tema é instalado, você pode acessá-lo como um modelo de site através do painel de controle.