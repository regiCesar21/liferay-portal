liferay-releng-app-description=Westeros Bank est un thème minimaliste inspiré des sites bancaires existants. Il fournit une base solide pour démarrer avec votre site financier. Westeros Bank n'introduit que les frais généraux nécessaires, vous permettant de créer facilement vos expériences personnalisées par-dessus.<br /><br />Le thème Westeros Bank comprend les fonctionnalités utiles suivantes :<ul><li>Contenu structuré pour créer des mises en page élégantes pour plusieurs cas d'utilisation</li><li>Espaces réservés de navigation personnalisables qui vous permettent de créer une expérience de navigation à grains fins</li></ul>Remarque : une fois ce thème installé, vous pouvez y accéder en tant que modèle de site via le panneau de commande.