liferay-releng-app-description=Aplicația Liferay REST APIs expune un nou tip de API-uri RESTful care interacționează cu serviciile Liferay. Aceste API-uri permit dezvoltatorilor să consume serviciile Liferay într-un mod simplu și flexibil. De exemplu, dezvoltatorii pot consuma resurse de portal precum documente, bloguri sau conținut structurat prin intermediul unor API-uri complet RESTful care acceptă mai multe formate de răspuns precum JSON sau XML. <br /><br />Această aplicație nu are o componentă vizuală în portal. După ce o instalați, puteți începe să accesați API-urile în URL-urile corespunzătoare pe care le puteți verifica prin http://[host]:[port]/o/api.