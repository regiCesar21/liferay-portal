liferay-releng-app-description=Este aplicativo está marcado como obsoleto. Atualizações e versões futuras podem não ser disponibilizadas.<br /><br />O Portlet Web Forms é uma ferramenta que permite que um administrador web defina um formulário a ser publicado no site. Os usuários que visitam o site podem preencher o formulário que é enviado a um endereço de e-mail configurado ou salvo (em um arquivo ou banco de dados). O título, a descrição introdutória do formulário, o endereço de e-mail e muitas outras opções apresentadas aos usuários podem ser configurados por meio da tela de configuração do portlet. É possível ter vários formulários na mesma página ou espalhados por várias páginas. As opções de salvamento também incluem a capacidade de salvar como um arquivo CSV externo (valores separados por vírgula) ou salvar os valores em uma tabela de banco de dados personalizada para processamento posterior.<br /><br />Este aplicativo aparecerá no menu de seu aplicativo quando instalado.