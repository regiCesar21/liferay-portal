liferay-releng-app-description=Cette application est obsolète. Les mises à jour et les versions futures peuvent ne pas être disponibles.<br /><br />Le portlet des formulaires Web est un outil qui permet à un administrateur Web de définir un formulaire à publier sur le site Web. Les utilisateurs visitant le site Web peuvent alors remplir le formulaire qui est ensuite envoyé à une adresse e-mail configurée ou enregistré (dans un fichier ou dans une base de données). Le titre, la description introductive du formulaire, l'adresse e-mail et de nombreuses autres options présentées aux utilisateurs peuvent être configurés via l'écran de configuration du portlet. Il est possible d'avoir plusieurs formulaires sur la même page ou répartis sur plusieurs pages. Les options d'enregistrement incluent également la possibilité d'enregistrer en tant que fichier CSV externe (valeurs séparées par des virgules) ou d'enregistrer les valeurs dans une table de base de données personnalisée pour un traitement ultérieur.<br /><br />Cette application apparaîtra une fois dans le menu de votre application installée.