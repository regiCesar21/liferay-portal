liferay-releng-app-description=Diese App befindet sich im Status "Veraltet". Updates und zukünftige Versionen sind möglicherweise nicht verfügbar.<br /><br />Das Webformular-Portlet ist ein Werkzeug, mit dem ein Web-Administrator ein Formular definieren kann, das auf der Website veröffentlicht werden soll. Benutzer, die die Website besuchen, können dann das Formular ausfüllen, das dann an eine konfigurierte E-Mail-Adresse gesendet oder gespeichert wird (in eine Datei oder in einer Datenbank). Der Titel, die einleitende Beschreibung des Formulars, die E-Mail-Adresse und viele andere Optionen, die den Benutzern angezeigt werden, sind über den Konfigurationsbildschirm des Portlets konfigurierbar. Es ist möglich, mehrere Formulare auf einer Seite oder auf mehrere Seiten verteilt anzuzeigen. Zu den Speicheroptionen gehört außerdem die Möglichkeit, als externe CSV-Datei (Comma-Separated Values) in Form kommagetrennter Werte zu speichern oder die Werte in einer benutzerdefinierten Datenbanktabelle zur weiteren Verarbeitung zu speichern.<br /><br />Diese App wird nach der Installation in Ihrem Anwendungsmenü angezeigt.