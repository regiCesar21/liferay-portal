liferay-releng-app-description=Deze app is verouderd. Mogelijk zijn geen updates en toekomstige versies beschikbaar.<br /><br />De webformulierenportlet is een hulpmiddel waarmee een webbeheerder een formulier kan definiëren dat op de website moet worden gepubliceerd. Gebruikers die de website bezoeken, kunnen het formulier invullen dat vervolgens naar een geconfigureerd e-mailadres wordt verzonden of wordt opgeslagen (in een bestand of database). De titel, inleidende beschrijving van het formulier, het e-mailadres en vele andere opties die aan de gebruikers worden getoond, zijn configureerbaar via het configuratiescherm van de portlet. Het is mogelijk om meerdere formulieren op dezelfde pagina te hebben of verspreid over meerdere pagina's. De opslagopties omvatten ook de mogelijkheid voor opslag als een extern CSV-bestand (Comma-Separated Values), of voor opslag van de waarden in een aangepaste databasetabel voor verdere verwerking.<br /><br />Na installatie verschijnt deze app in uw applicatiemenu.