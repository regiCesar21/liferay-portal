liferay-releng-app-description=Aplicația Bookmarks adaugă un widget care poate fi utilizat pentru a lista și organiza bookmark-urile. Plasarea widgetului Bookmarks pe o pagină de site le permite administratorilor să selecteze marcajele de interes pentru întreaga comunitate. Widgetul poate marca pagini interne ale portalului, precum și URL-uri externe<br /><br />După ce ați instalat această aplicație, puteți accesa widgetul Bookmarks din meniul Widgeturi.