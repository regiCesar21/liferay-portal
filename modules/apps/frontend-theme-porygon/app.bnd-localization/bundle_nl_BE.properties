liferay-releng-app-description=Het Porygon-thema is ontworpen om uw digitale tijdschrift onder de aandacht te brengen. Porygon is een modern en visueel aantrekkelijk thema dat uw toch al geweldige inhoud nieuw leven inblaast.<br /><br />Het Porygon-thema voorziet de volgende handige functies:<ul><li>Diverse voorbeeldweergave-opties</li><li>Gestructureerde inhoud om elegante lay-outs te creëren voor verschillende gebruikssituaties</li><li>Compatibiliteit voor blogs en inhoud</li><li>16 artikelvoorbeelden met grote foto's en realistische inhoud</li><li>Een portletdecorateur die u kunt gebruiken om specifieke inhoud of een applicatie in de schijnwerpers te plaatsen</li><li>Subtiele en minimalistische zoekintegratie</li></ul><br /><br />Opmerking: na installatie van dit thema kunt u een volledig functionele site van het type Porygon maken vanuit het scherm Sitebeheer.