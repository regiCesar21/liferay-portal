liferay-releng-app-description=O tema Porygon foi projetado para demonstrar sua revista digital. Porygon é um tema moderno e visualmente atraente que dá mais vida ao seu conteúdo já incrível.<br /><br />O tema Porygon conta com estes recursos úteis:<ul><li>Várias opções de exibição para visualizar o conteúdo</li><li>Conteúdo estruturado para criar layouts elegantes para vários casos de uso</li><li>Compatibilidade de blog e conteúdo</li><li>16 postagens de amostra com fotos ótimas e conteúdo realista</li><li>Um decorador de portlet que você pode usar para apresentar conteúdo ou aplicativo específico</li><li>Integração de pesquisa sutil e minimalista</li></ul><br /><br />Nota: Depois que este tema for instalado, você poderá criar um site semelhante ao Porygon, totalmente funcional, a partir do painel de administração de sites.