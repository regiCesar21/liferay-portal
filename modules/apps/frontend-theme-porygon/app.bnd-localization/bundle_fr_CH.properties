liferay-releng-app-description=Le thème Porygon est conçu pour présenter votre magazine numérique. Porygon est un thème moderne et visuellement attrayant qui donne une nouvelle vie à votre contenu déjà incroyable.<br /><br />Le thème Porygon comprend ces fonctionnalités utiles :<ul><li>Diverses options d'affichage pour l'aperçu du contenu</li><li>Contenu structuré pour créer des mises en page élégantes pour plusieurs cas d'utilisation</li><li>Compatibilité avec les blogs et le contenu</li><li>16 exemples d'articles avec de grandes photos et un contenu réaliste</li><li>Un décorateur de portlet que vous pouvez utiliser pour présenter un contenu spécifique ou une application</li><li>Intégration de recherche subtile et minimaliste</li></ul><br /><br />Remarque : une fois ce thème installé, vous aurez la possibilité de créer un site entièrement fonctionnel de type Porygon à partir du panneau d'administration des sites.