liferay-releng-app-description=Das Porygon-Theme wurde zur Präsentation Ihres digitalen Magazins entwickelt. Porygon ist ein modernes und visuell attraktives Theme, das Ihren bereits erstaunlichen Inhalten neues Leben einhaucht. <br /><br />Das Porygon-Theme enthält diese nützlichen Funktionen: <ul><li>Variable Darstellungsoptionen für die Inhaltsvorschau</li><li>Strukturierte Inhalte, um elegante Layouts für verschiedene Anwendungsfälle zu erstellen</li><li>Entsprechende Unterstützung für Blogs und Inhalte</li><li>16 Artikelbeispiele mit großen Fotos und realistischen Inhalten</li><li>Einen Portlet-Dekorator, den Sie verwenden können, um bestimmte Inhalte oder eine Anwendung zu präsentieren</li><li>Subtile und minimalistische Suchintegration</li></ul><br /><br />Hinweis: Sobald dieses Theme installiert ist, haben Sie die Möglichkeit, eine voll funktionsfähige Site des Typs Porygon über die Site-Verwaltung zu erstellen.