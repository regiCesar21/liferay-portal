custom-field-display-type-help=이 필드를 설정하기 위해 사용하는 컨트롤 유형을 입력합니다.
custom-field-height-help=픽셀 단위로 입력 필드의 높이를 설정합니다.
custom-field-hidden-help=사용자 정의 필드를 숨김으로 설정하면 필드 값이 이 인터페이스 외에는 어떤 사용자 인터페이스에도 표시되지 않습니다. 이렇게 하면 사용자 지정 권한에 대한 자리 표시자 역할과 같은 더 모호하고 고급 목적으로 필드를 사용할 수 있습니다.
custom-field-index-type-help=사용자 정의 필드를 검색 가능으로 설정하면 엔터티(예: 사용자)가 수정될 때 필드 값이 인덱싱됩니다. java.lang.String 필드만 검색할 수 있습니다. 필드를 새로 검색 가능하게 만든 경우 데이터를 검색할 수 있으려면 인덱스를 업데이트해야 합니다.
custom-field-key-help=커스텀 필드 키는 {0} 태그를 통해 프로그래밍 방식으로 필드에 액세스하는 데 사용됩니다.
custom-field-localize-field-name-help=사용자 정의 필드를 현지화 가능한 필드 이름으로 설정하면 필드 이름이 언어 속성 파일에 정의된 언어 키에 따라 현지화됩니다. 기본 언어 키를 재정의하려면 설명서를 참조하십시오.
custom-field-precision-help=정밀도는 숫자의 길이를 설정합니다.
custom-field-secret-help=사용자 지정 필드를 비밀로 설정하면 입력이 화면에 숨겨집니다. 암호에 사용하십시오.
custom-field-visible-with-update-permission-help=업데이트 권한이 있는 사용자 정의 필드를 표시하도록 설정하면 업데이트 권한이 있는 사용자가 이 필드를 볼 수 있습니다. 이 경우 이 설정은 숨김 값을 재정의합니다.
