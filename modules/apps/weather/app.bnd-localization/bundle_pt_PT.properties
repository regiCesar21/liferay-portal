liferay-releng-app-description=Este aplicativo fornece uma indicação visual rápida do clima em um conjunto de locais configuráveis. Os locais podem ser especificados através de um nome de cidade textual (como "Los Angeles, CA" ou "China") ou código postal (como 32701 nos Estados Unidos). Links para uma tela de resumo no OpenWeatherMap.org são fornecidos para cada local. As leituras de temperatura podem ser configuradas para Celsius ou Fahrenheit.<br /><br />Este aplicativo aparecerá no menu do seu aplicativo quando instalado.