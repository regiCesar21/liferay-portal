liferay-releng-app-description=Diese App bietet eine schnelle visuelle Anzeige des Wetters für eine konfigurierbare Gruppe von Orten. Orte können mit einem textuellen Städtenamen (wie "Los Angeles, KA" oder "China") oder einer Postleitzahl (wie 32701 in den USA) angegeben werden. Für jeden Ort werden Links zu einem Übersichtsbildschirm bei OpenWeatherMap.org bereitgestellt. Die Temperaturwerte können für Celsius oder Fahrenheit konfiguriert werden.<br /><br />Diese App wird nach der Installation in Ihrem Anwendungsmenü angezeigt.