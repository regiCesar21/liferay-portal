liferay-releng-app-description=Cette application fournit une indication visuelle rapide de la météo sur un ensemble d'emplacements configurables. Les emplacements peuvent être spécifiés à l'aide d'un nom de ville textuel (tel que « Los Angeles, CA » ou « Chine ») ou d'un code postal (tel que 32701 aux États-Unis). Des liens vers un écran de résumé sur OpenWeatherMap.org sont fournis pour chaque emplacement. Les lectures de température peuvent être configurées pour Celsius ou Fahrenheit.<br /><br />Cette application apparaîtra dans le menu de votre application une fois installée.