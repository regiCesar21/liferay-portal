liferay-releng-app-description=Deze app geeft een snelle visuele indicatie van het weer op een configureerbare reeks locaties. Locaties kunnen worden opgegeven met een tekstuele plaatsnaam (zoals "Los Angeles, CA" of "China") of een postcode (zoals 32701 in de VS). Voor elke locatie worden links naar een overzichtsscherm op OpenWeatherMap.org gegeven. Temperatuurmetingen kunnen worden geconfigureerd voor Celsius of Fahrenheit.<br /><br />Deze app zal na installatie in uw applicatiemenu verschijnen.