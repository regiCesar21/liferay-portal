liferay-releng-app-description=Bean Portlet oferă capacitatea CDI de "bean portlet". Aceasta vă permite să înregistrați portlete utilizând adnotări precum @PortletConfiguration and its @Inject adnotarea obține dependențele prin intermediul Contexts and Dependency Injection (CDI). Bean portlets este o caracteristică a specificației Portlet 3.0, așa cum este definită de JSR 362.<br /><br />Modulele Bean Portlet se instalează în LIFERAY_HOME/osgi/modules/static.