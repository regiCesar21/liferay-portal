liferay-releng-app-description=Fjord is een minimalistisch thema geïnspireerd op bestaande productsites. Hiermee kunt u een aantrekkelijke en boeiende site maken om uw product onder de aandacht te brengen en te promoten. Fjord introduceert alleen de noodzakelijke structuur waarop u gemakkelijk uw eigen ervaringen kunt bouwen.<br /><br />De voornaamste kenmerken van het Fjord-thema zijn: <ul> <li> Fragmenten en paginasjablonen waarmee u gemakkelijk aantrekkelijke inhoud voor uw site kunt maken</li><li>Configureerbare links naar sociale media</li><li>Configureerbare navigatie op volledig scherm</li></ul>Fjord bevat een starterkit met fragmenten en paginasjablonen die u kunt gebruiken; u hoeft alleen een nieuwe site met dit thema als sjabloon te maken om er toegang toe te krijgen!