liferay-releng-app-description=Fjord ist ein minimalistisches Theme, das von bestehenden Produkt-Websites inspiriert wurde. Mit ihm können Sie eine ansprechende und einnehmende Website erstellen, um Ihr Produkt zu präsentieren und zu bewerben. Fjord sorgt nur für den erforderlichen Overhead, sodass Sie ganz einfach Ihre benutzerdefinierten Erlebnisse darauf aufbauen können.<br /><br />Das Fjord-Theme enthält diese Hauptfunktionen:<ul><li>Fragmente und Seitenvorlagen, mit denen Sie ganz einfach attraktive Inhalte für Ihre Website erstellen können</li><li>Konfigurierbare Social Media-Links</li><li>Konfigurierbare Vollbildnavigation</li></ul>Fjord wird mit einem Starter-Kit bereitgestellt, das Fragmente und Seitenvorlagen enthält, die Sie verwenden können. Erstellen Sie einfach eine neue Website mit diesem Theme als Vorlage, um Zugriff darauf zu erhalten!