liferay-releng-app-description=Fjord é um tema minimalista inspirado em sites de produtos existentes. Ele permite que você crie um site atraente e envolvente para mostrar e promover seu produto. O Fjord apresenta apenas a sobrecarga necessária, tornando mais fácil para você criar suas experiências personalizadas em cima dele.<br /><br />O tema Fjord inclui estes recursos principais:<ul><li>Fragmentos e modelos de página que permitem que você crie com facilidade um conteúdo envolvente para seu site</li><li>Links de mídia social configuráveis ​</li><li>Navegação em tela inteira configurável</li></ul>O Fjord vem com um kit inicial contendo snippets e modelos de página que você pode usar; basta criar um novo site com este tema como modelo para acessá-lo!