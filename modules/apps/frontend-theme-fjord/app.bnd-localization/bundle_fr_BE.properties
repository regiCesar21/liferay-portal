liferay-releng-app-description=Fjord est un thème minimaliste inspiré des sites de produits existants. Il vous permet de créer un site attrayant et engageant pour présenter et promouvoir votre produit. Fjord n'introduit que les frais généraux nécessaires, vous permettant de créer facilement vos expériences personnalisées par-dessus.<br /><br />Le thème Fjord comprend ces fonctionnalités clés :<ul><li>Fragments et modèles de page qui vous permettent de facilement créer un contenu attrayant pour votre site</li><li>Liens de réseaux sociaux configurables</li><li>Navigation plein écran configurable</li></ul>Fjord est livré avec un kit de démarrage contenant des fragments et des modèles de page que vous pouvez utiliser ; créez simplement un nouveau site avec ce thème comme modèle pour y accéder !