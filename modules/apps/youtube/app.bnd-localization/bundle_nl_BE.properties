liferay-releng-app-description=Deze app maakt het gemakkelijk om YouTube-video's in te sluiten op Liferay-pagina's. De grootte, plaatsing en gebruikersopties zijn configureerbaar om de visuele weergave van de video te optimaliseren en zaken als afspelen op volledig scherm mogelijk te maken.<br /><br />Na installatie verschijnt deze app in uw applicatiemenu.