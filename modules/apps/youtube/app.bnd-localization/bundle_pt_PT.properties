liferay-releng-app-description=Este aplicativo facilita a integração de vídeos do Youtube nas páginas do Liferay. O tamanho, localização e opções do usuário podem ser configurados para otimizar a aparência visual do vídeo e permitir coisas como a reprodução em tela inteira.<br /><br />Este aplicativo aparecerá no menu do seu aplicativo quando instalado.