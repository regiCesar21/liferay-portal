liferay-releng-app-description=Cette application facilite l'intégration de vidéos Youtube dans les pages Liferay. La taille, l'emplacement et les options utilisateur peuvent être configurés pour optimiser l'apparence visuelle de la vidéo et permettre des choses comme la lecture en plein écran.<br /><br />Cette application apparaîtra dans le menu de votre application une fois installée.