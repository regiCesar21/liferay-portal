liferay-releng-app-description=Mit dieser App können Sie ganz einfach Youtube-Videos in Liferay-Seiten einbinden. Größe, Platzierung und Benutzeroptionen können konfiguriert werden, um das visuelle Erscheinungsbild des Videos zu optimieren und Dinge wie die Vollbildwiedergabe zu ermöglichen.<br /><br />Diese App wird nach der Installation in Ihrem Anwendungsmenü angezeigt.