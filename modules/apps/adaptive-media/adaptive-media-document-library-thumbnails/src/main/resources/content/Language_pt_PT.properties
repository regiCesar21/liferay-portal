adaptive-media-system-images-configuration-name=Resoluções de Imagem do Sistema
preview-am-configuration=Pré-visualização da configuração
preview-am-configuration-description=Introduza o ID de configuração para substituir o comportamento padrão dos media adaptativos para a pré-visualizações da biblioteca de documentos.
thumbnail-am-configuration=Configuração da miniatura
thumbnail-am-configuration-description=Insira a ID de configuração para substituir o comportamento padrão da Adaptive Media pelas miniaturas da biblioteca de documentos. Ao usar URLs para obter estas miniaturas, use a cadeia de consulta "imageThumbnail=1".
thumbnail-custom-1-am-configuration=Configuração de miniatura personalizada 1
thumbnail-custom-1-am-configuration-description=Introduza o ID de configuração para mudar o comportamento padrão dos media adaptativos da miniatura personalizada 1 da biblioteca de documentos. Quando utilizar URLs para ir buscar esta miniatura, utilize a query string "imageThumbnail=2".
thumbnail-custom-2-am-configuration=Configuração de miniatura personalizada 2
thumbnail-custom-2-am-configuration-description=Introduza o ID de configuração para mudar o comportamento padrão dos media adaptativos da miniatura personalizada 2 da biblioteca de documentos. Quando utilizar URLs para ir buscar esta miniatura, utilize a query string "imageThumbnail=3".