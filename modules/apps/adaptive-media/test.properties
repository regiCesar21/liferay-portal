test.batch.names=\
    subrepository-functional-tomcat90-mysql57-jdk8,\
    subrepository-integration-mysql57-jdk8

test.batch.run.property.query[functional-bundle-tomcat-mysql57-jdk8][test-portal-hotfix-release]=\
    ${test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant]}

test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant]=\
    (portal.acceptance == true) AND \
    (\
        (testray.component.names ~ "Adaptive Media") OR \
        (testray.main.component.name ~ "Adaptive Media")\
    )

test.batch.run.property.query[subrepository-functional-tomcat90-mysql57-jdk8]=\
    testray.main.component.name == "Adaptive Media"

testray.main.component.name=Adaptive Media