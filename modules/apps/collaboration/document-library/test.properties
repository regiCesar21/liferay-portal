test.batch.run.property.query[functional-bundle-tomcat-mysql56-jdk8][test-portal-hotfix-release]=\
    ${test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant]}

test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant]=\
    (portal.acceptance == true) AND \
    (\
        (testray.component.names ~ "Documents Management") OR \
        (testray.main.component.name ~ "Documents Management")\
    )

test.batch.run.property.query[functional-upgrade*-tomcat*-mysql*-jdk8][relevant]=\
    (testray.component.names ~ "Documents Management") AND \
    (testray.main.component.name ~ "Upgrades Collaboration")