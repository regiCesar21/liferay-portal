layout-converter-configuration-name=위젯 페이지에서 콘텐츠 페이지로의 변환기
layout-converter-configuration-verified-layout-template-ids-description=이러한 레이아웃 템플릿을 사용하는 위젯 페이지의 변환이 올바르게 작동하는 것으로 확인되었습니다. 다른 모든 경우 변환이 완료된 후 미리 보기에 들어갈 때 경고가 표시됩니다.
this-page-has-customizable-columns.-this-capability-is-not-supported-for-content-pages-and-will-be-lost-if-the-conversion-draft-is-published=이 페이지에는 사용자 정의 가능한 열이 있습니다. 이 기능은 콘텐츠 페이지에서 지원되지 않으며 변환 초안이 게시되면 손실됩니다.
this-page-uses-a-custom-page-layout.-a-best-effort-conversion-has-been-performed.-verify-the-conversion-draft-before-publishing-it=이 페이지는 사용자 정의 페이지 레이아웃을 사용합니다. 최상의 변환이 수행되었습니다. 게시하기 전에 변환 초안을 확인하십시오.
this-page-uses-a-custom-page-layout.-all-widgets-have-been-placed-in-a-single-column-and-will-require-manual-reorganization=이 페이지는 사용자 정의 페이지 레이아웃을 사용합니다. 모든 위젯은 단일 열에 배치되었으며 수동 재구성이 필요합니다.
this-page-uses-nested-applications-widgets.-they-have-been-placed-in-a-single-column-and-may-require-manual-reorganization=이 페이지는 중첩된 애플리케이션 위젯을 사용합니다. 중첩된 애플리케이션 위젯 내부에 있던 모든 위젯은 단일 열에 배치되었으며 수동 재구성이 필요할 수 있습니다.
