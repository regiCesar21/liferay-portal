blogs-image-maximum-file-size=Tamanho máximo de imagem de blogs
blogs-image-maximum-file-size-description=Defina o tamanho máximo do arquivo para imagens armazenadas com entradas de blogs. As imagens podem ser enviadas usando um editor de alloy, uma imagem de capa ou um seletor de imagens. Um valor de 0 para o tamanho máximo do arquivo pode ser usado para indicar o tamanho ilimitado do arquivo. No entanto, o tamanho máximo do arquivo permitido é definido na propriedade "com.liferay.portal.upload.UploadServletRequestImpl.max.size". O valor padrão é de 5 MB. (Automatic Translation)
