blogs-image-maximum-file-size-description=Impostate la dimensione massima del file per le immagini memorizzate con le voci dei blog. Le immagini possono essere caricate utilizzando un editor Alloy, un'immagine di copertina o un selettore di immagini. È possibile utilizzare un valore pari a 0 per la dimensione massima del file per indicare una dimensione illimitata del file. Tuttavia, la dimensione massima consentita per il file è impostata nella proprietà "com.liferay.portal.upload.UploadServletRequestImpl.max.size". Il valore predefinito è 5 mb. (Automatic Translation)
