active-help=이 연결을 활성화하거나 비활성화합니다. (Automatic Translation)
additional-configurations=추가 설정
additional-configurations-help=이 구성은 임베디드 (개발) 모드에만 적용됩니다. YML 형식(elasticsearch.yml)으로 Sidecar Elasticsearch 노드에 대한 사용자 설정을 세팅합니다.
additional-index-configurations=추가 인덱스 설정
additional-index-configurations-help=JSON (Elasticsearch Create Index API) 또는 YML 형식으로 라이프레이 인덱스에 대한 사용자 설정을 세팅합니다.
additional-type-mappings=추가 유형 맵핑
additional-type-mappings-help=JSON 형식(Elasticsearch Put Mapping API)으로 LiferayDocumentType에 대한 사용자 지정 매핑을 설정합니다. 이 값은 새 필드 매핑으로만 설정해야 합니다. 기본 필드에 대해 중복된 매핑으로 설정하면 인덱스 생성이 실패합니다. 기본 매핑을 완전히 변경하려면 유형 매핑 재정의를 사용합니다.
authentication-enabled=인증 활성
authentication-enabled-help=사용자 이름 및 비밀번호로 Elasticsearch 인증을 활성 혹은 비활성합니다.
bootstrap-mlockall=Bootstrap Mlockall
bootstrap-mlockall-help=이 설정은 임베디드 (개발) 모드에만 적용합니다. 선택된 경우, Elasticsearch 메모리가 삭제되는 것을 방지하기 위해 프로세스 주소 공간은 RAM에 잠깁니다.
cluster-name=클러스터 이름
cluster-name-help=이 구성은 EMBEDDED(개발) 모드에만 적용됩니다. 가입할 클러스터의 이름을 설정합니다.
connection-id=연결 ID
connection-id-help=이 연결에 유일한 아이디를 입력합니다.
discovery-zen-ping-unicast-hosts-port=Zen 탐색 유니캐스트 호스트 포트
discovery-zen-ping-unicast-hosts-port-help=이 구성은 더 이상 사용되지 않습니다. 이 구성은 EMBEDDED(개발) 모드에만 적용됩니다. discovery.zen.ping.unicast.hosts 값을 빌드할 때 사용할 포트 범위를 제공하십시오. 포트 범위에 있는 여러 Elasticsearch 노드는 동일한 컴퓨터에서 가십 라우터 역할을 할 수 있습니다.
elasticsearch-connection-configuration-name=Elasticsearch 연결
elasticsearch7-configuration-name=Elasticsearch 7
embedded-http-port=임베디드 HTTP 포트
embedded-http-port-help=이 구성은 더 이상 사용되지 않습니다. 이 구성은 EMBEDDED(개발) 모드에만 적용됩니다. Production 모드가 비활성화되고 Operation Mode가 EMBEDDED로 설정된 경우 생성되는 사이드카 Elasticsearch 노드의 HTTP 포트를 설정합니다.
http-cors-allow-origin=HTTP CORS 오리진 허용
http-cors-allow-origin-help=이 구성은 EMBEDDED(개발) 모드에만 적용됩니다. HTTP CORS가 활성화된 경우 허용할 원본을 설정합니다.
http-cors-configurations=HTTP CORS 구성
http-cors-configurations-help=이 구성은 EMBEDDED(개발) 모드에만 적용됩니다. HTTP CORS에 대한 사용자 지정 설정을 YML 형식(elasticsearch.yml)으로 제공합니다.
http-cors-enabled=HTTP CORS 활성화됨
http-cors-enabled-help=이 구성은 임베디드(개발) 모드에만 적용됩니다. 이 옵션을 선택하면 다른 오리진의 브라우저가 Elastic 검색에 요청할 수 있는지 여부를 결정하는 교차 오리진 리소스 공유가 사용됩니다. 비활성화된 경우 탄성 검색 헤드와 같은 웹 프런트 엔드 도구를 연결할 수 없습니다.
http-ssl-enabled=HTTP SSL 사용
http-ssl-enabled-help=TLS/SSL을 활성화하거나 비활성화합니다.
index-name-prefix=인덱스 이름 접두사
index-name-prefix-help=검색 인덱스 이름의 접두사를 설정합니다. 이 값은 정상적인 조건에서 변경하면 안 됩니다. 이 값을 변경하는 경우 포털을 다시 인덱싱한 다음 Elasticsearch 관리 콘솔을 사용하여 이전 인덱스를 수동으로 삭제해야 합니다.
log-exceptions-only=예외만 기록
log-exceptions-only-help=이 항목을 선택하면 Elasticsearch의 예외가 다시 발생하지 않고 포착되고 기록됩니다.
minimum-required-node-version=최소 필수 노드 버전
minimum-required-node-version-help=Elasticsearch 클라이언트와 호환되기 위해 모든 Elasticsearch 노드가 있어야 하는 최소 버전을 설정합니다.
network-bind-host=네트워크 바인드 호스트
network-bind-host-help=이 구성은 EMBEDDED(개발) 모드에만 적용됩니다. 들어오는 요청을 수신하기 위해 노드가 바인딩해야 하는 네트워크 인터페이스를 지정합니다.
network-host=네트워크 호스트
network-host-addresses=네트워크 호스트 주소
network-host-addresses-help=연결할 원격 HTTP 호스트를 설정합니다.
network-host-help=이 구성은 EMBEDDED(개발) 모드에만 적용됩니다. 클러스터의 다른 노드에 호스트를 게시(광고)하는 데 사용되는 노드에 바인딩된 호스트 이름 또는 IP 주소를 설정합니다. 바인드 호스트와 게시 호스트를 동시에 설정하는 바로 가기입니다.
network-publish-host=네트워크 게시 호스트
network-publish-host-help=이 구성은 EMBEDDED(개발) 모드에만 적용됩니다. 해당 노드가 연결할 수 있도록 노드가 클러스터의 다른 노드에 알리는 단일 인터페이스를 설정합니다.
node-name=노드 이름
node-name-help=이 구성은 임베디드(개발) 모드에만 적용됩니다. 시작할 노드의 이름을 설정합니다. 설정이 해제된 경우 "life ray"가 사용됩니다.
number-of-index-replicas=회사 및 시스템 인덱스 복제본 수
number-of-index-replicas-help=각 Liferay 회사 및 시스템 인덱스에 대한 복제본 수를 설정합니다. 설정하지 않으면 복제본이 사용되지 않습니다. 이 값에 대한 변경 사항은 전체 재색인 후에 적용됩니다.
number-of-index-shards=회사 및 시스템 인덱스 샤드 수
number-of-index-shards-help=Liferay 회사 및 시스템 인덱스가 생성될 때 사용할 샤드 수를 설정합니다. 설정하지 않으면 단일 샤드가 사용됩니다. 이 값에 대한 변경 사항은 전체 재색인 후에 적용됩니다.
operation-mode=운영 모드
operation-mode-help=이 구성은 더 이상 사용되지 않습니다. 프로덕션 모드가 활성화된 경우 이 설정은 무시됩니다. REMOTE(프로덕션) 작동 모드는 원격 독립형 Elasticsearch 클러스터에 연결되며 프로덕션 모드를 활성화하여 달성할 수도 있습니다. EMBEDDED(개발) 작동 모드는 외부 사이드카 Elasticsearch 인스턴스를 실행하는 하위 프로세스를 시작합니다. EMBEDDED 작동 모드는 지원되지 않습니다.
override-type-mappings=유형 맵핑 재정의
override-type-mappings-help=JSON 형식(Elasticsearch Put Mapping API)으로 LiferayDocumentType에 대한 기본 매핑을 완전히 대체하도록 사용자 지정 매핑을 설정합니다. 이 값을 설정하면 인덱스 생성은 대신 이 대체 매핑 정의를 사용하여 기본 매핑 정의 및 모든 확장점을 무시합니다. 기본 필드에 대한 비표준 매핑으로 LiferayDocumentType을 생성해야 하는 경우 이를 사용하십시오. 기본값을 겹치지 않고 새 사용자 지정 매핑을 추가하기만 하면 되는 경우 additionalTypeMappings를 사용합니다.
password-help=Authentication Enabled가 체크된 경우 Elasticsearch 인증을 위한 비밀번호를 설정합니다.
production-mode-enabled=운영 모드 활성
production-mode-enabled-help=프로덕션 모드를 활성화합니다. 이 항목을 선택하면 생산 모드가 활성화되고 작동 모드 구성이 무시됩니다. 프로덕션 모드는 원격 독립형 Elasticsearch 클러스터에 연결됩니다. 이 항목을 선택하지 않으면 작동 모드 구성이 사용됩니다.
proxy-host-help=클라이언트 연결에 사용할 프록시 호스트를 설정합니다.
proxy-password=프록시 비밀번호
proxy-password-help=프록시에 연결하기 위한 암호를 설정합니다.
proxy-port-help=클라이언트가 연결하는 데 사용하는 프록시 포트를 설정합니다.
proxy-username=프록시 사용자 이름
proxy-username-help=프록시를 통해 연결하는 경우 사용할 프록시 사용자 이름을 설정합니다.
remote-cluster-connection-id=원격 클러스터 연결 ID
remote-cluster-connection-id-help=원격 클러스터에 연결할 때 사용할 Elasticsearch 연결의 연결 ID를 선택합니다. Elasticsearch 연결은 Elasticsearch 연결 시스템 설정에서 정의됩니다. 이 값을 설정하지 않으면 이 페이지의 연결 구성이 대신 원격 클러스터 연결에 사용됩니다.
rest-client-logger-level=REST 클라이언트 로거 수준
rest-client-logger-level-help=Elasticsearch REST 클라이언트의 로깅 수준을 설정합니다.
sidecar-debug=사이드카 디버그
sidecar-debug-help=사이드카 프로세스에 대한 디버그 모드를 활성화하려면 이를 true로 설정하십시오.
sidecar-debug-settings=사이드카 디버그 설정
sidecar-debug-settings-help=사이드카 프로세스를 디버깅하는 데 사용되는 JVM 옵션을 설정합니다.
sidecar-heartbeat-interval=사이드카 하트비트 간격
sidecar-heartbeat-interval-help=사이드카 프로세스의 상태를 감지하는 데 사용되는 하트비트 간격을 밀리초 단위로 설정합니다.
sidecar-home=사이드카 홈
sidecar-home-help=사이드카 프로세스를 시작하는 데 사용되는 사이드카 기본 폴더의 경로를 설정합니다.
sidecar-http-port=사이드카 HTTP 포트
sidecar-http-port-help=This configuration only applies to sidecar. Set the HTTP port range of the sidecar Elasticsearch node.
sidecar-jvm-options=사이드카 JVM 옵션
sidecar-jvm-options-help=사이드카 프로세스에서 사용할 JVM 옵션을 설정합니다.
sidecar-shutdown-timeout=사이드카 종료 타임아웃
sidecar-shutdown-timeout-help=사이드카 프로세스가 강제로 종료되기 전에 대기할 시간을 밀리초 단위로 설정합니다.
track-total-hits=총 조회수 추적
track-total-hits-help=검색 결과가 10,000개를 초과할 때 총 히트 수를 정확하게 계산하려면 이를 true로 설정하십시오. 이를 true로 설정하면 검색에 대한 히트 수가 많을 때 성능에 영향을 줄 수 있습니다.
transport-tcp-port=전송 TCP 포트
transport-tcp-port-help=이 구성은 EMBEDDED(개발) 모드에만 적용됩니다. 노드 간 통신을 위해 바인딩할 포트를 지정합니다. 단일 값 또는 범위(예: 9300-9400)를 허용합니다.
truststore-password=신뢰 저장소 암호
truststore-password-help=HTTP SSL 사용이 선택된 경우 신뢰 저장소에 암호를 설정하십시오.
truststore-path=신뢰 저장소 경로
truststore-path-help=HTTP SSL 사용이 선택된 경우 신뢰 저장소 파일의 경로를 설정하십시오.
truststore-type=신뢰 저장소 유형
truststore-type-help=HTTP SSL 사용이 선택된 경우 신뢰 저장소 유형을 설정하십시오.
username=사용자 이름
username-help=인증 활성화가 선택된 경우 Elasticsearch 인증을 위한 사용자 이름을 설정합니다.