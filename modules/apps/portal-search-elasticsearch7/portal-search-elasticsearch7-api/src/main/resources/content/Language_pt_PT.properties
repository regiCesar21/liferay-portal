active-help=Ativar ou desativar essa conexão. (Automatic Translation)
additional-configurations=Configuração adicional
additional-configurations-help=Esta configuração só se aplica ao modo EMBEDDED (Desenvolvimento). Defina configurações personalizadas para o nó de carro lateral Elasticsearch, em formato YML (elasticsearch.yml). (Automatic Translation)
additional-index-configurations=Configuração adicional de índice
additional-index-configurations-help=Defina configurações personalizadas para o índice Liferay, no formato JSON (Elasticsearch Create Index API) ou YML. (Automatic Translation)
additional-type-mappings=Mapeamentos de tipos adicionais
additional-type-mappings-help=Mapeamento personalizado para o LiferayDocumentTypem em formato JSON (API "Put Mapping" do Elasticsearch). Este valor deve ser definido apenas com os novos mapeamentos. Se você definir este valor com quaisquer mapeamentos de sobreposição para os campos predefinidos, a criação do índice falha. Para substituir completamente os mapeamentos predefinidos, use overrideTypeMappings.
authentication-enabled=Habilitar autenticação
authentication-enabled-help=Habilite ou desabilitar a autenticação para o Elasticsearch com um nome de usuário e senha. (Automatic Translation)
bootstrap-mlockall=Bootstrap Mlockall (Automatic Translation)
bootstrap-mlockall-help=Esta configuração só se aplica ao modo EMBEDDED (Desenvolvimento). Se isso for verificado, o espaço de endereço do processo será bloqueado em RAM, impedindo que qualquer memória Elasticsearch seja trocada. (Automatic Translation)
cluster-name=Nome do cluster
cluster-name-help=Esta configuração só se aplica ao modo EMBEDDED (Desenvolvimento). Defina o nome do cluster para participar. (Automatic Translation)
connection-id=ID de Conexão
connection-id-help=Definir um ID único para esta conexão.
discovery-zen-ping-unicast-hosts-port=Porta de hosts unicast do Zen Discovery
discovery-zen-ping-unicast-hosts-port-help=Esta configuração está preterida. Esta configuração só se aplica ao modo EMBEDDED (Desenvolvimento). Forneça uma variedade de portas para usar ao construir o valor discovery.zen.ping.unicast.hosts. Vários nós de pesquisa elástica em uma variedade de portas podem agir como roteadores de fofoca no mesmo computador. (Automatic Translation)
elasticsearch-connection-configuration-name=Conexões de escrouça (Automatic Translation)
elasticsearch7-configuration-name=Pesca elástica 7 (Automatic Translation)
embedded-http-port=Porta HTTP incorporada (Automatic Translation)
embedded-http-port-help=Esta configuração está preterida. Esta configuração só se aplica ao modo EMBEDDED (Desenvolvimento). Defina a porta HTTP do nó dearro elástico de carro lateral que é criado quando o modo de produção é desativado e o modo de operação é definido como EMBEDDED. (Automatic Translation)
http-cors-allow-origin=HTTP CORS permitem origem (Automatic Translation)
http-cors-allow-origin-help=Esta configuração só se aplica ao modo EMBEDDED (Desenvolvimento). Defina as origens para permitir quando o HTTP CORS estiver ativado. (Automatic Translation)
http-cors-configurations=Configurações HTTP CORS (Automatic Translation)
http-cors-configurations-help=Esta configuração só se aplica ao modo EMBEDDED (Desenvolvimento). Forneça configurações personalizadas para HTTP CORS, em formato YML (elasticsearch.yml). (Automatic Translation)
http-cors-enabled=HTTP CORS ativado (Automatic Translation)
http-cors-enabled-help=Esta configuração só se aplica ao modo EMBEDDED (Desenvolvimento). Se isso for verificado, o compartilhamento de recursos de origem cruzada será ativado, o que determina se um navegador em outra origem pode fazer solicitações ao Elasticsearch. Se desativadas, ferramentas frontais da Web como a cabeça de ângulo elástica podem ser incapazes de se conectar. (Automatic Translation)
http-ssl-enabled=HTTP SSL ativado (Automatic Translation)
http-ssl-enabled-help=Habilitar ou desabilitar TLS/SSL. esta configuração só é aplicada se a opção Autenticação Habilitada estiver marcada.
index-name-prefix=Prefixo do nome do índice
index-name-prefix-help=O prefixo para o nome do índice de pesquisa. Este valos não deve ser alterado sob condições normais. Se você alterar este valor, você também deve reindexar o portal e então excluir manualmente o antigo índice usando o console de administração do Elasticsearch.
log-exceptions-only=Registrar apenas para exceções
log-exceptions-only-help=Se isso for verificado, exceções da Elasticsearch são capturadas e registradas sem serem re-lançadas. (Automatic Translation)
minimum-required-node-version=Versão de nó mínima necessária
minimum-required-node-version-help=Defina a versão mínima que todos os nós Elasticsearch devem ter para serem compatíveis com o cliente Elasticsearch.
network-bind-host=Host de vinculação da rede
network-bind-host-help=Esta configuração só se aplica ao modo EMBEDDED (Desenvolvimento). Especifique a interface de rede(s) a que um nó deve se vincular para ouvir as solicitações recebidas. (Automatic Translation)
network-host=Host de rede
network-host-addresses=Endereços de host de rede (Automatic Translation)
network-host-addresses-help=Defina os hosts HTTP remotos para se conectar. (Automatic Translation)
network-host-help=Esta configuração só se aplica ao modo EMBEDDED (Desenvolvimento). Defina o nome do host ou endereço IP vinculado ao nó, que é usado para publicar (anunciar) o host para outros nós no cluster. Este é um atalho que define o host bind e o host de publicação ao mesmo tempo. (Automatic Translation)
network-publish-host=Host de publicação da rede
network-publish-host-help=Esta configuração só se aplica ao modo EMBEDDED (Desenvolvimento). Defina a interface única que o nó anuncia para outros nós no cluster, para que esses nós possam se conectar a ele. (Automatic Translation)
node-name=Nome do nó (Automatic Translation)
node-name-help=Esta configuração só se aplica ao modo EMBEDDED (Desenvolvimento). Defina o nome do nó para começar. Se não for definido, "liferay" é usado. (Automatic Translation)
number-of-index-replicas=Número de réplicas de índices de empresas e sistemas (Automatic Translation)
number-of-index-replicas-help=Defina o número de réplicas para cada empresa Liferay e índice do sistema. Se não fordefinido, nenhuma réplica será usada. Alterações nesse valor fazem efeito após um redex completo. (Automatic Translation)
number-of-index-shards=Número de Fragmentos de Índice de Empresas e Sistemas (Automatic Translation)
number-of-index-shards-help=Defina o número de fragmentos para usar quando uma empresa Liferay e o índice do sistema forem criados. Se não for definido, um único fragmento será usado. Alterações nesse valor fazem efeito após um redex completo. (Automatic Translation)
operation-mode=Modo de operação
operation-mode-help=Esta configuração está preterida. Se o modo de produção estiver ativado, essa configuração será ignorada. O modo de operação REMOTE (Production) se conecta a um cluster de talarca elástico autônomo remoto, que também pode ser alcançado através da habilitação do modo de produção. O modo de operação EMBEDDED (Development) inicia um processo infantil executando uma instância de carro lateral externo Elasticsearch. O modo de operação EMBEDDED não tem suporte. (Automatic Translation)
override-type-mappings=Sobrepor mapeamento de tipo
override-type-mappings-help=Sobrepor mapeamentos para todos os LiferayDocumentType, no formato JSON (API "Put Mapping" do Elasticsearch). Se você definir este valor, a criação de índice ignora a definição de mapeamento padrão e qualquer ponto de extensão, usando esta definição de mapeamento alternativa em seu lugar. Use isto se você precisar que o LiferayDocumentType seja criado com mapeamento não padrão para campos padrão. Se você só precisar adicionar novos mapeamentos personalizados sem sobrepor nenhum padrão, use additionalTypeMappings.
password-help=Defina a senha para autenticar em Elasticsearch se a autenticação ativada for verificada. (Automatic Translation)
production-mode-enabled=Modo de produção ativado (Automatic Translation)
production-mode-enabled-help=Habilite o modo de produção. Se isso for verificado, o modo produção será ativado e a configuração do Modo de Operação será ignorada. O modo de produção se conecta a um cluster de talarca elástico autônomo remoto. Se isso não for verificado, será utilizada a configuração Modo de Operação. (Automatic Translation)
proxy-host-help=Defina o host proxy para ser usado para a conexão do cliente. (Automatic Translation)
proxy-password=Senha do proxy
proxy-password-help=Defina a senha para se conectar ao proxy. (Automatic Translation)
proxy-port-help=Defina a porta proxy para ser usada para a conexão do cliente. (Automatic Translation)
proxy-username=Nome de usuário Proxy
proxy-username-help=Definir o nome de usuário proxy a ser usada quando conectando-se através de um proxy.
remote-cluster-connection-id=ID de conexão de cluster remoto (Automatic Translation)
remote-cluster-connection-id-help=Escolha o ID de conexão da conexão Elasticsearch a ser usada ao se conectar ao cluster remoto. As conexões de arma elástica são definidas nas configurações do sistema de conexões de série elástica. Se esse valor não for definido, as configurações de conexão nesta página serão usadas para a conexão de cluster remoto. (Automatic Translation)
rest-client-logger-level=Nível de Agente de Log Cliente Rest
rest-client-logger-level-help=Defina o nível de login para o cliente REST Elasticsearch.
sidecar-debug=Sidecar Debug (Automatic Translation)
sidecar-debug-help=Defina isso como true para ativar o modo de depuração para o processo sidecar. (Automatic Translation)
sidecar-debug-settings=Configurações de depuração de sidecar (Automatic Translation)
sidecar-debug-settings-help=Defina as opções JVM usadas para depurar o processo sidecar. (Automatic Translation)
sidecar-heartbeat-interval=Intervalo de batimentos cardíacos sidecar (Automatic Translation)
sidecar-heartbeat-interval-help=Defina o intervalo de batimentos cardíacos em milissegundos usados para detectar a saúde do processo sidecar. (Automatic Translation)
sidecar-home=Casa sidecar (Automatic Translation)
sidecar-home-help=Defina o caminho da pasta base sidecar usada para iniciar o processo sidecar. (Automatic Translation)
sidecar-http-port=Porta SIDEcar HTTP (Automatic Translation)
sidecar-http-port-help=This configuration only applies to sidecar. Set the HTTP port range of the sidecar Elasticsearch node.
sidecar-jvm-options=Opções de Sidecar JVM (Automatic Translation)
sidecar-jvm-options-help=Defina as opções JVM utilizadas pelo processo sidecar. (Automatic Translation)
sidecar-shutdown-timeout=Tempo limite de desligamento do sidecar (Automatic Translation)
sidecar-shutdown-timeout-help=Defina o tempo em milissegundos para esperar antes que o processo sidecar seja desligado à força. (Automatic Translation)
track-total-hits=Acompanhar acessos totais
track-total-hits-help=Definir como verdadeiro para calcular o número total de acessos quando houver mais do que 10.000 resultados para uma busca. Definir como verdadeiro pode ter um impacto no desempenho quando houver um grande número de acessos para uma busca.
transport-tcp-port=Porta TCP do transporte
transport-tcp-port-help=Esta configuração só se aplica ao modo EMBEDDED (Desenvolvimento). Especifique a porta para vincular para comunicação entre nós. Aceita um único valor ou uma faixa (por exemplo, 9300-9400). (Automatic Translation)
truststore-password=Senha do Truststore (Automatic Translation)
truststore-password-help=Defina a senha para o truststore se o HTTP SSL Ativado for verificado. (Automatic Translation)
truststore-path=Caminho truststore (Automatic Translation)
truststore-path-help=Defina o caminho para o arquivo truststore se o HTTP SSL Ativado for verificado. (Automatic Translation)
truststore-type=Tipo Truststore (Automatic Translation)
truststore-type-help=Defina o tipo de truststore se a opção HTTP SSL Habilitado estiver marcada.
username=Username
username-help=Defina o nome de usuário para autenticar em Elasticsearch se a autenticação ativada for verificada. (Automatic Translation)