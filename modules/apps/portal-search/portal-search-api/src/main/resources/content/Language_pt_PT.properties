buffered=Em buffer
buffered-execution-mode=Modo de execução em buffer
default-keyword-query-configuration-name=Consulta por palavra-chave padrão
default-search-result-permission-filter-configuration-name=Filtro de permissão de resultado de busca padrão
disabled-entry-class-names=Nomes de classe de entrada desabilitados
disabled-entry-class-names-help=Especifica os nomes de classe de entrada para os quais DefaultKeywordQueryContributor não incluirá os campos de descrição, Nome de usuário e título como parte da consulta de busca por palavra-chave.
exact-match-boost=Aumento de combinação exata
exact-match-boost-help=Defina o valor do aumento a ser aplicado quando os termos da pesquisa combinarem com um título como uma frase exata.
excluded-entry-class-names=Nomes de classe de entrada excluído
field-name-patterns=Padrão de nome de campo
include-inherited-permissions=Inclui a permissão herdada
include-inherited-permissions-help=Defina como verdadeiro para incluir os róis herdados pelo utilizador como parte do filtro de permissões da pesquisa. Os róis herdados pelo utilizador incluem todos os utilizadores atribuidos a um utilizador a partir do seu grupo de utilizador e as filiações à organização.
index-commit-immediately=Confirmar índice imediatamente
index-commit-immediately-help=Coloque esta opção como verdade para efetuar o commit imediato dos pedidos de escrita nos índices de pesquisa. Colocar esta opção como verdade pode impactar negativamente na performance do motor de pesquisas, uma vez que cada pedido de escrita vai forçar o motor de pesquisa a refrescar o leitor do índice e potencialmente, provocar descargas transacionais para disco. O comportamento por omissão do Portal é para efetuar o commit imediatamente para operações sobre índices individuais (Ex. adicionar blog, atualizar blog), mas atrasar os commits para operações em massa (Ex. indexar todos os utilizadores, indexar todas as wikis) até que todas as entradas tenham sido enviadas para o motor de pesquisa. Colocar esta opção a falso pode resultar em algumas portlets como o Publicador de Conteúdos a exibir algum tempo de espera nas respostas quando apresentando conteúdo recém adicionado. Por exemplo, os utilizadores podem experienciar alguma demora com o motor de pesquisa por omissão Elasticsearch. Ver https://www.elastic.co/guide/en/elasticsearch/guide/current/near-real-time.html para mais informações.
index-status-manager-configuration-name=Gerenciar estado do índice
index-writer-helper-configuration-name=Ajudante do Escritor de Índices
indexer-registry-configuration-name=Indexar Registro
indexing-batch-sizes=Tamanhos de lote de indexação
indexing-batch-sizes-help=O número de documentos a serem indexados por lote por tipos de modelos que dão suporte à indexação de lote. 1000 como padrão. Para modelos com documentos maiores, diminuir este valor pode melhorar a estabilidade ao executar uma reindexação completa.
max-buffer-size=Tamanho máximo do buffer
max-expansions=Expansões máximas
max-expansions-help=Defina o número de títulos únicos que podem ser combinados quando os termos de busca combinarem com um título como um prefixo de frase.
minimum-buffer-availability-percentage=Porcentagem de disponibilidade mínima do buffer
nonbulk-indexing-override=Substituir indexação individual
nonbulk-indexing-override-help=Um valor de "verdadeiro" faz com que as entidades modificadas sejam reindexadas uma por uma. Por questões de desempenho, esta configuração geralmente é deixada desligada na produção.
permission-filtered-search-result-accurate-count-threshold=Limite de contagem precisa do resultado da busca filtrada por permissão
permission-filtered-search-result-accurate-count-threshold-help=Se a consulta de busca devolver resultados de busca com uma contagem que está dentro deste limite, a contagem total após a filtragem por permissão tem a precisão garantida.
permission-terms-limit=Limite de termos de permissão
permission-terms-limit-help=Defina isso para limitar o número de termos de pesquisa de permissão que serão adicionados à consulta de pesquisa. Se esse limite for excedido, nenhum termo de pesquisa de permissão será adicionado. Em vez disso, a verificação de permissão cairá de volta para o filtro de permissão de pesquisa. (Automatic Translation)
query-pre-process-configuration-name=Preprocessador de Consultas de Indexação
reindex-configuration-name=Reindexar
reindexer-configuration-name=Reindexador
search-engine-helper-configuration-name=Assistente do Mecanismo
search-permission-checker-configuration-name=Verificador de Permissão
search-query-result-window-limit=Limite de janela de resultado de consulta de pesquisa
search-query-result-window-limit-help=Definir para limitar o número de resultados de bisca que podem ser solicitados para uma consulta de busca.
synchronous-execution-override=Substituição de execução síncrona
synchronous-execution-override-help=Um valor de "verdadeiro" faz com que as entidades modificadas sempre sejam bloqueadas até serem concluídas. Por questões de desempenho, esta configuração geralmente é deixada desligada na produção.
title-field-query-builder-configuration-name=Construtor de Consultas do Campo de Título