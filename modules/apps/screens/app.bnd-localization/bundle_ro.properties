liferay-releng-app-description=Liferay Screens este un cadru format din componente native pentru Android și iOS numite Screenlets. Screenlets simplifică dezvoltarea prin implementarea unor cazuri de utilizare comune în aplicațiile mobile care se conectează la instanțele Liferay. Aplicația Liferay Screens Compatibility expune clase și metode suplimentare care nu sunt prezente în API-ul gata de utilizare al Liferay. Aceste clase și metode sunt necesare pentru ca Screenlets să funcționeze corect în aplicațiile dvs. mobile. Instalarea acestei aplicații expune în mod automat aceste clase și metode; aplicația nu oferă și nici nu necesită o interfață de utilizare.